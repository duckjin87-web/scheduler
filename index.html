};
function evTimeText(e) { if (e.allDay) return "종일"; if (!e.time) return ""; return e.endTime ? `${e.time}–${e.endTime}` : e.time; }
// 분류 이모지: 업무=회사, 개인=사람
function catIcon(cat) { return cat === "personal" ? "👤" : "🏢"; }
const daysBetween = (a, b) => Math.round((parseYMD(b) - parseYMD(a)) / 86400000);
const fmtMD = (s) => { if (!s) return ""; const d = parseYMD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };

/* ---------- 프로젝트 헬퍼 ---------- */
// 프로젝트 색 선택: 추천 10색 + 무지개 칸(직접 선택)
function projColorPicker(id, current) {
  const custom = !PROJECT_COLORS.includes(current);
  return `<div class="pj-colors" id="${id}">${PROJECT_COLORS.map((c) => `<button type="button" class="pj-sw ${c === current ? "active" : ""}" data-c="${c}" style="background:${c}" aria-label="색상"></button>`).join("")}`
    + `<label class="pj-sw pj-custom ${custom ? "active" : ""}" title="색상 직접 선택" style="${custom ? `background:${current}` : ""}"><input type="color" value="${custom ? current : "#7c6fb0"}" aria-label="색상 직접 선택" /></label></div>`;
}
// onPick(color, final): 추천색 클릭·직접 선택 확정 시 final=true, 고르는 중(미리보기)엔 false
function wireColorPicker(id, onPick) {
  const box = document.getElementById(id); if (!box) return;
  const cu = box.querySelector(".pj-custom"), inp = cu.querySelector("input");
  const setActive = (el) => box.querySelectorAll(".pj-sw").forEach((x) => x.classList.toggle("active", x === el));
  box.querySelectorAll("button.pj-sw").forEach((b) => b.addEventListener("click", () => { setActive(b); cu.style.background = ""; onPick(b.dataset.c, true); }));
  inp.addEventListener("input", () => { cu.style.background = inp.value; setActive(cu); onPick(inp.value, false); });
  inp.addEventListener("change", () => { cu.style.background = inp.value; setActive(cu); onPick(inp.value, true); });
}
function completedProjectIds() {
  return new Set(Store.state.projects.filter((p) => { const st = projectStats(p.id); return st.total && st.done === st.total; }).map((p) => p.id));
}
function projectById(id) { return id ? Store.state.projects.find((p) => p.id === id) || null : null; }
// 프로젝트 단계 = 소속 일정·할 일 (날짜 → 시간 → 생성순 = 진행 순서)
function projectItems(pid) {
  const items = [];
  Store.state.todos.forEach((t) => { if (t.projectId === pid) items.push({ kind: "todo", id: t.id, title: t.title, date: t.due, time: "", done: t.done, rolledFrom: t.rolledFrom, planned: t.planned, createdAt: t.createdAt }); });
  Store.state.events.forEach((e) => { if (e.projectId === pid) items.push({ kind: "event", id: e.id, title: e.title, date: e.date, time: e.allDay ? "" : e.time, done: e.done, rolledFrom: e.rolledFrom, planned: e.planned, createdAt: e.createdAt }); });
  return items.sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (a.time || "").localeCompare(b.time || "") || a.createdAt - b.createdAt);
}
function projectStats(pid) {
  const items = projectItems(pid);
  const dated = items.filter((x) => x.date);
  const done = items.filter((x) => x.done).length;
  const today = todayStr();
  const delay = items.reduce((m, x) => (!x.done && x.rolledFrom ? Math.max(m, daysBetween(x.rolledFrom, today)) : m), 0);
  return { items, total: items.length, done, pct: items.length ? Math.round((done / items.length) * 100) : 0,
    start: dated.length ? dated[0].date : null, end: dated.length ? dated[dated.length - 1].date : null,
    next: items.find((x) => !x.done) || null, delay };
}
function projTag(pid) {
  const p = projectById(pid); if (!p) return "";
  return `<span class="ptag" style="--pc:${p.color}" data-proj="${p.id}" title="프로젝트 열기">${esc(p.name)}</span>`;
}
function projDot(pid) {
  const p = projectById(pid); if (!p) return "";
  return `<span class="pj-dot" style="background:${p.color}" title="${esc(p.name)}"></span>`;
}
// 프로젝트 단계를 뒤로 미뤘을 때 뒤 단계도 같이 밀지 묻기 (순서 연결)
function offerCascade(pid, id, oldDate, newDate) {
  const p = projectById(pid);
  if (!p || !oldDate || !newDate || newDate <= oldDate) return;
  const d = daysBetween(oldDate, newDate);
  const cnt = Store.countProjectAfter(pid, id, oldDate);
  if (cnt && confirm(`'${p.name}'의 뒤 단계 ${cnt}개도 ${d}일 같이 밀까요?`)) {
    Store.shiftProjectAfter(pid, id, oldDate, d); toast(`뒤 단계 ${cnt}개를 ${d}일 밀었습니다`);
    if (modalState && modalState.kind === "project" && modalState.id === pid) renderProjectModal(pid);
  }
}

// 오늘 일정 목록 = 오늘 발생 이벤트(이월된 항목 포함, D+N = 원래 날짜로부터 지연일)
function todayAgendaEvents() {
  const today = todayStr();
  return eventsOn(today).filter((e) => !e.done)
    .map((e) => ({ ...e, _delay: e.rolledFrom ? daysBetween(e.rolledFrom, today) : 0 }))
    .sort((a, b) => (a.time || "").localeCompare(b.time || ""));
}

/* ---------- 렌더: 오늘 ---------- */
function renderToday() {
  const today = todayStr();
  const evs = todayAgendaEvents();
  const dueToday = visibleTodos().filter((t) => !t.done && t.due === today);
  const overdue = visibleTodos().filter((t) => !t.done && t.due && t.due < today);
  let html = `<div class="view-head"><div><h2>오늘</h2><div class="sub">${fmtKDate(today)}</div></div></div>`;
  html += `<p class="panel-title">오늘 일정 · ${evs.length}건</p>`;
  html += evs.length ? `<div class="agenda">${evs.map(eventRow).join("")}</div>` : `<div class="empty">오늘 일정이 없습니다.</div>`;
  html += `<p class="panel-title" style="margin-top:22px">오늘 마감 할 일 · ${dueToday.length}건</p>`;
  html += dueToday.length ? `<div class="agenda">${dueToday.map(todoRow).join("")}</div>` : `<div class="empty">${IC.check}오늘 마감 할 일이 없습니다.</div>`;
  if (overdue.length) {
    html += `<p class="panel-title" style="margin-top:22px">지연된 할 일 · ${overdue.length}건</p>`;
    html += `<div class="agenda">${overdue.map(todoRow).join("")}</div>`;
    html += `<button class="btn-roll" id="roll-mobile">${IC.roll}지난 할 일 오늘로 이월</button>`;
  }
  return html;
}

// 캘린더 컨트롤(주 이동) — 상단 탭바 우측에 표시. 월~일/월~금은 설정에서 변경
function calControlsHtml() {
  return `<div class="week-nav">
      <button id="wk-prev">${IC.left}</button>
      <button class="today-btn" id="wk-today">오늘</button>
      <button id="wk-next">${IC.right}</button>
    </div>`;
}

const inProject = (x) => !!(x.projectId && projectById(x.projectId));
// 프로젝트 단계는 캘린더에서 프로젝트 색으로 음영 (우선순위 음영 대신)
const projCls = (x) => (inProject(x) ? " proj-item" : "");
const projStyle = (x) => (inProject(x) ? ` style="--pc:${projectById(x.projectId).color}"` : "");

/* ---------- 렌더: 캘린더 (주간 그리드) ---------- */
function renderCalendar() {
  const nDays = ui.workweek ? 5 : 7;
  const week = [...Array(nDays)].map((_, i) => addDays(ui.weekRef, i));
  const today = todayStr();
  const head = "";
  // 오늘 열은 다른 날보다 좌우 폭 1.5배
  const cols = `grid-template-columns:46px ` + week.map((d) => ymd(d) === today ? "minmax(96px,1.5fr)" : "minmax(60px,1fr)").join(" ") + ";";
  let grid = `<div class="week-scroll"><div class="week-grid" style="${cols}"><div class="corner"></div>`;
  week.forEach((d) => {
    const isToday = ymd(d) === today;
    grid += `<div class="head ${isToday ? "today" : ""}"><span class="dow">${DOW[d.getDay()]}</span><span class="num">${d.getDate()}</span></div>`;
  });
  // 프로젝트 타임라인 바 — 이번 주와 겹치는 프로젝트마다 한 줄 (진행률 채움 + 단계 표식)
  const dayCols = week.map((d) => ymd(d) === today ? "minmax(96px,1.5fr)" : "minmax(60px,1fr)").join(" ");
  const wStart = ymd(week[0]), wEnd = ymd(week[week.length - 1]);
  // 모든 단계가 끝난 프로젝트는 캘린더에서 숨김(막대·단계 모두) → 프로젝트 탭에서 확인
  const doneProj = completedProjectIds();
  const hiddenDone = (x) => !!(x.projectId && doneProj.has(x.projectId));
  const clampIdx = (ds) => Math.max(0, Math.min(nDays - 1, daysBetween(wStart, ds)));
  Store.state.projects.map((p) => ({ p, st: projectStats(p.id) }))
    .filter(({ p, st }) => st.start && st.start <= wEnd && st.end >= wStart && !doneProj.has(p.id))
    .forEach(({ p, st }, i) => {
      const si = clampIdx(st.start), ei = clampIdx(st.end);
      const contL = st.start < wStart, contR = st.end > wEnd;
      const last = st.items.filter((x) => x.date).slice(-1)[0];
      const marks = st.items.filter((x) => x.date && x.date >= wStart && x.date <= wEnd).map((x) => {
        const late = !x.done && x.rolledFrom;
        const ms = x === last && st.items.length > 1;
        return `<span class="pj-step ${x.done ? "done" : ""} ${late ? "late" : ""} ${ms ? "ms" : ""}" style="grid-column:${daysBetween(wStart, x.date) + 1}" title="${esc(x.title)}${x.done ? " (완료)" : ""}"></span>`;
      }).join("");
      grid += `<div class="proj-label">${i === 0 ? "프로젝트" : ""}</div>`;
      grid += `<div class="proj-lane" style="grid-template-columns:${dayCols};--pc:${p.color}">
        <div class="pj-bar ${contL ? "cont-l" : ""} ${contR ? "cont-r" : ""}" style="grid-column:${si + 1} / ${ei + 2}" data-proj="${p.id}" title="${esc(p.name)} · ${st.done}/${st.total} 완료 — 클릭해서 단계 보기">
          <span class="pj-fill" style="width:${st.pct}%"></span>
          <span class="pj-lab">${contL ? "◀ " : ""}${esc(p.name)}<b class="pj-pct">${st.pct}%</b><span class="pj-cnt">${st.done}/${st.total}</span>${st.delay ? ` <b class="pj-late">D+${st.delay}</b>` : ""}${contR ? " ▶" : ""}</span>
        </div>${marks}</div>`;
    });
  // 종일/할일 밴드
  grid += `<div class="band-label">종일<br>·할일</div>`;
  week.forEach((d) => {
    const ds = ymd(d);
    const isToday = ds === today;
    const allday = eventsOn(ds).filter((e) => e.allDay && !hiddenDone(e));
    const todos = visibleTodos().filter((t) => t.due === ds && !hiddenDone(t));
    let cell = `<div class="band-cell ${isToday ? "today-col" : ""}" data-date="${ds}" data-band="1">`;
    // 종일·할일은 최대 3개만 보이고 나머지는 ----+N---- 구분선 뒤로 접음 (완료 항목이 뒤로)
    const chips = [];
    allday.forEach((e) => chips.push({ done: e.done, html: `<div class="cal-chip allday pri-${e.priority} ${e.cat} ${e.done ? "done" : ""}${projCls(e)}"${projStyle(e)} draggable="true" data-drag="event" data-id="${e._base}" data-edit-event="${e._base}"><span class="cal-check ${e.done ? "done" : ""}" data-ev-toggle="${e._base}">${e.done ? IC.check : ""}</span><span class="ci">${catIcon(e.cat)}</span>${projDot(e.projectId)}${esc(e.title)}</div>` }));
    todos.forEach((t) => chips.push({ done: t.done, html: `<div class="cal-chip todo ${t.done ? "done" : ""}${projCls(t)}"${projStyle(t)} draggable="true" data-drag="todo" data-id="${t.id}" data-edit-todo="${t.id}"><span class="cal-check ${t.done ? "done" : ""}" data-toggle="${t.id}">${t.done ? IC.check : ""}</span>${projDot(t.projectId)}${esc(t.title)}</div>` }));
    chips.sort((a, b) => a.done - b.done);
    const LIMIT = 3, open = !!ui.bandOpen[ds], extra = chips.length - LIMIT;
    cell += (open || extra <= 0 ? chips : chips.slice(0, LIMIT)).map((c) => c.html).join("");
    if (extra > 0) cell += `<button type="button" class="band-more ${open ? "open" : ""}" data-band-more="${ds}" title="${open ? "접기" : `${extra}개 더 보기`}"><span>${open ? "접기 −" : `+${extra}`}</span></button>`;
    cell += `</div>`;
    grid += cell;
  });
  // 시간 행 — 시간 범위(시작~종료)만큼 세로로 채워지는 블록으로 표시
  const CELL_H = 46;
  const toMin = (t) => { const [a, b] = (t || "0:0").split(":").map(Number); return a * 60 + (b || 0); };
  // 하루 단위 겹침 배치: 시간이 겹치는 묶음(cluster)마다 열을 나누고, 비어 있는 오른쪽 열은 넓혀서 사용
  const dayLayout = {};
  week.forEach((d) => {
    const ds = ymd(d), lay = {};
    const items = eventsOn(ds).filter((e) => !e.allDay && e.time && !hiddenDone(e)).map((e) => {
      const s0 = toMin(e.time), e0 = e.endTime ? toMin(e.endTime) : s0 + 30;
      return { id: e._base, s: s0, e: s0 + Math.max(30, e0 - s0) };
    }).sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s));
    let cluster = [], cols = [], cEnd = -1;
    const finish = () => {
      const n = cols.length;
      cluster.forEach((it) => {
        let span = 1;
        for (let c = it.col + 1; c < n; c++) {
          if (cluster.some((o) => o.col === c && o.s < it.e && it.s < o.e)) break;
          span++;
        }
        lay[it.id] = { col: it.col, n, span };
      });
      cluster = []; cols = []; cEnd = -1;
    };
    items.forEach((it) => {
      if (cluster.length && it.s >= cEnd) finish();          // 앞 묶음과 겹치지 않음 → 새 묶음
      let c = cols.findIndex((end) => end <= it.s);
      if (c < 0) { c = cols.length; cols.push(it.e); } else cols[c] = it.e;
      it.col = c; cluster.push(it); cEnd = Math.max(cEnd, it.e);
    });
    if (cluster.length) finish();
    dayLayout[ds] = lay;
  });
  for (let h = 8; h <= 20; h++) {
    grid += `<div class="hourlabel">${h}:00</div>`;
    week.forEach((d) => {
      const ds = ymd(d);
      const isToday = ds === today;
      const starts = eventsOn(ds).filter((e) => !e.allDay && !hiddenDone(e) && parseInt((e.time || "0").slice(0, 2), 10) === h);
      const inner = starts.map((e) => {
        const sM = toMin(e.time), eM = e.endTime ? toMin(e.endTime) : sM + 30;
        const dur = Math.max(30, eM - sM);
        const top = ((sM - h * 60) / 60) * CELL_H;
        const height = (dur / 60) * CELL_H - 2;
        const L = dayLayout[ds][e._base] || { col: 0, n: 1, span: 1 };
        const left = (L.col / L.n) * 100, w = (L.span / L.n) * 100;
        return `<div class="evt timed pri-${e.priority} ${e.cat} ${e.done ? "done" : ""}${projCls(e)}" style="${inProject(e) ? `--pc:${projectById(e.projectId).color};` : ""}top:${top.toFixed(1)}px;left:calc(${left}% + 1px);width:calc(${w}% - 3px);height:${height.toFixed(1)}px;" title="${esc(evTimeText(e))} ${esc(e.title)}" draggable="true" data-drag="event" data-id="${e._base}" data-edit-event="${e._base}"><span class="rz rz-top" data-rz="top" title="위로 끌어 시작 시간 변경"></span><span class="cal-check ${e.done ? "done" : ""}" data-ev-toggle="${e._base}">${e.done ? IC.check : ""}</span><span class="t">${esc(evTimeText(e))}</span><span class="ci">${catIcon(e.cat)}</span>${e.rolledFrom ? `<span class="evt-d">D+${daysBetween(e.rolledFrom, e.date)}</span>` : ""}${projDot(e.projectId)}${esc(e.title)}${e.repeat !== "none" ? " ↻" : ""}<span class="rz rz-bot" data-rz="bot" title="아래로 끌어 종료 시간 변경"></span></div>`;
      }).join("");
      grid += `<div class="cell ${starts.length ? "has-evt" : ""} ${isToday ? "today-col" : ""}" data-date="${ds}" data-hour="${pad(h)}:00">${inner}</div>`;
    });
  }
  grid += `</div></div>`;
  return head + grid;
}

/* ---------- 렌더: 할 일 ---------- */
function renderTodo() {
  let list = visibleTodos();
  if (ui.todoFilter === "active") list = list.filter((t) => !t.done);
  else if (ui.todoFilter === "done") list = list.filter((t) => t.done);
  list.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const ad = a.due || "9999", bd = b.due || "9999";
    if (ad !== bd) return ad.localeCompare(bd);
    return PRIO[a.priority].rank - PRIO[b.priority].rank;
  });
  const seg = (v, l) => `<button class="${ui.todoFilter === v ? "active" : ""}" data-todo-filter="${v}">${l}</button>`;
  let html = `<div class="view-head"><h2>할 일</h2><div class="seg">${seg("active", "진행중")}${seg("done", "완료")}${seg("all", "전체")}</div></div>`;
  html += list.length ? `<div class="agenda">${list.map(todoRow).join("")}</div>` : `<div class="empty">${IC.check}표시할 할 일이 없습니다.</div>`;
  return html;
}

/* ---------- 행 렌더 ---------- */
function eventRow(e) {
  const id = e._base || e.id;
  const meta = [e.location, e.repeat !== "none" ? REPEAT_LABEL[e.repeat] : "", e.reminder !== "none" ? "알림" : ""].filter(Boolean).join(" · ");
  const delay = e._delay ? `<span class="dbadge">D+${e._delay}</span>` : "";
  const ptag = `<span class="tag ${e.priority}">${PRIO[e.priority].label}</span>`;
  return `<div class="row-item ${e.cat} pri-${e.priority} ${e.done ? "done" : ""}">
    <div class="box ${e.done ? "done" : ""}" data-ev-toggle="${id}">${e.done ? IC.check : ""}</div>

      <button data-edit-event="${id}" title="수정">${IC.edit}</button>
      <button data-del-event="${id}" title="삭제">${IC.trash}</button>
    </div></div>`;
}
function todoRow(t) {
  const tag = t.priority !== "normal" ? `<span class="tag ${t.priority}">${PRIO[t.priority].label}</span>` : "";
  const overdue = !t.done && t.due && t.due < todayStr();
  const dueTxt = t.due ? `<span class="${overdue ? "tag overdue" : ""}">${fmtDueMeta(t.due)}</span>` : "";
  const late = t.rolledFrom ? daysBetween(t.rolledFrom, todayStr()) : 0;
  const roll = late > 0 ? `<span class="dbadge">D+${late}</span>` : "";
  return `<div class="todo ${t.done ? "done" : ""}">
    <div class="box ${t.done ? "done" : ""}" data-toggle="${t.id}">${t.done ? IC.check : ""}</div>
    <div class="tx" data-edit-todo="${t.id}">
      <div class="title">${esc(t.title)}</div>
      <div class="meta">${tag}${dueTxt}${roll}<span>· ${t.cat === "work" ? "업무" : "개인"}</span>${projTag(t.projectId)}</div>
    </div>
    <div class="actions">
      <button data-edit-todo="${t.id}" title="수정">${IC.edit}</button>
      <button data-del-todo="${t.id}" title="삭제">${IC.trash}</button>
    </div></div>`;
}

/* ---------- 대시보드 (캘린더 모드 우측) — 기본 한 줄, 클릭 시 펼침 ---------- */
function renderDash() {
  const today = todayStr();
  const evToday = eventsOn(today).length;
  const dueToday = visibleTodos().filter((t) => !t.done && t.due === today).length;
  const overdue = visibleTodos().filter((t) => !t.done && t.due && t.due < today);
  const important = visibleTodos().filter((t) => !t.done && t.priority !== "normal").sort((a, b) => PRIO[a.priority].rank - PRIO[b.priority].rank).slice(0, 5);

  let html = `<div class="dash-head"><span class="dash-title">요약</span><button class="dash-x" id="dash-collapse" title="패널 접기 (캘린더만 보기)">⟩</button></div>`;

  // 오늘 요약 (한 줄 / 펼침)
  const sumVal = `일정 ${evToday} · 마감 ${dueToday} · <span class="${overdue.length ? "warn" : ""}">지연 ${overdue.length}</span>`;
  html += `<div><div class="sumline" data-dash-toggle="summary"><span class="lbl">오늘 요약</span><span class="val">${sumVal}</span><span class="chev">${ui.dashExp.summary ? "▲" : "▼"}</span></div>`;
  if (ui.dashExp.summary) {
    html += `<div class="kpis" style="margin-top:8px">
      <div class="kpi"><div class="n">${evToday}</div><div class="l">오늘 일정</div></div>
      <div class="kpi"><div class="n">${dueToday}</div><div class="l">오늘 마감</div></div>
      <div class="kpi ${overdue.length ? "warn" : ""}"><div class="n">${overdue.length}</div><div class="l">지연 업무</div></div></div>`;
    if (overdue.length) {
      html += `<div style="margin-top:8px">` + overdue.slice(0, 5).map((t) => `<div class="roll-row"><span class="from">${t.due.slice(5)}</span><span>${esc(t.title)}</span></div>`).join("");
      html += `<button class="btn-roll" id="roll-desktop">${IC.roll}지난 업무 오늘로 이월</button></div>`;
    }
  }
  html += `</div>`;

  // 중요 할 일 (한 줄 / 펼침)
  const impVal = important.length ? `${important.length}건 · ${esc(important[0].title)}${important.length > 1 ? " 외" : ""}` : "없음";
  html += `<div><div class="sumline" data-dash-toggle="important"><span class="lbl">중요 할 일</span><span class="val">${impVal}</span><span class="chev">${ui.dashExp.important ? "▲" : "▼"}</span></div>`;
  if (ui.dashExp.important) {
    html += important.length ? `<div class="agenda" style="margin-top:8px">${important.map(todoRow).join("")}</div>` : `<div class="empty">중요 표시된 할 일 없음</div>`;
  }
  html += `</div>`;
  return html;
}

let modalState = null;

function openModal(kind, data) {

/* ---------- 시계형 시간 선택기 (시 → 분) ---------- */
let tpState = null;
function ensureTimePop() {
  let el = document.getElementById("timepop");
  if (el) return el;
  el = document.createElement("div"); el.id = "timepop"; el.className = "timepop"; el.hidden = true;
  el.innerHTML = `<div class="tp-head"><span class="tp-cur" id="tp-cur"></span><div class="tp-steps"><button type="button" data-step="h">시</button><button type="button" data-step="m">분</button></div></div><div class="tp-clock" id="tp-grid"></div><div class="tp-hint" id="tp-hint"></div>`;
  document.body.appendChild(el);
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    const s = e.target.closest(".tp-steps button"); if (s) { tpRender(s.dataset.step); return; }
    const g = e.target.closest("#tp-grid button"); if (g) tpPick(g.dataset.v);
  });
  return el;
}
function openTimePicker(inp, onPick) {
  const el = ensureTimePop();
  const [h, m] = (inp.value || "09:00").split(":").map(Number);
  tpState = { inp, onPick, h: isNaN(h) ? 9 : h, m: isNaN(m) ? 0 : m, step: "h" };
  el.hidden = false;
  const r = inp.getBoundingClientRect();
  let left = r.left, top = r.bottom + 6;
  if (left + 220 > window.innerWidth) left = window.innerWidth - 224;
  if (top + 250 > window.innerHeight) top = Math.max(8, r.top - 256);
  el.style.left = Math.max(8, left) + "px"; el.style.top = top + "px";
  tpRender("h");
}
function tpRender(step) {
  if (!tpState) return; tpState.step = step;
  const el = document.getElementById("timepop");
  document.getElementById("tp-cur").textContent = pad(tpState.h) + ":" + pad(tpState.m);
  document.getElementById("tp-hint").textContent = step === "h" ? "시(hour)를 선택하세요" : "분(minute)을 선택하세요";
  el.querySelectorAll(".tp-steps button").forEach((b) => b.classList.toggle("active", b.dataset.step === step));
  const clock = document.getElementById("tp-grid");
  const C = 102; // 시계 중심
  const btn = (val, label, x, y, cls, sel) => `<button type="button" data-v="${val}" class="${cls || ""} ${sel ? "sel" : ""}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;">${label}</button>`;
  let html = "";
  if (step === "h") {
    // 바깥 고리: 1~12, 안쪽 고리: 0,13~23 (12·00을 맨 위로)
    for (let i = 1; i <= 12; i++) { const a = (i / 12) * 2 * Math.PI; html += btn(i, pad(i), C + 82 * Math.sin(a), C - 82 * Math.cos(a), "", i === tpState.h); }
    for (let i = 0; i < 12; i++) { const val = i === 0 ? 0 : i + 12; const a = (i / 12) * 2 * Math.PI; html += btn(val, pad(val), C + 52 * Math.sin(a), C - 52 * Math.cos(a), "inner", val === tpState.h); }
  } else {
    for (let m = 0; m < 60; m += 5) { const a = (m / 60) * 2 * Math.PI; html += btn(m, pad(m), C + 82 * Math.sin(a), C - 82 * Math.cos(a), "", m === tpState.m); }
  }
  clock.innerHTML = html + `<div class="tp-center"></div>`;
}
function tpPick(v) {
  v = parseInt(v, 10);
  if (tpState.step === "h") { tpState.h = v; tpRender("m"); }   // 시 선택 → 분 선택으로
  else { tpState.m = v; tpState.onPick(pad(tpState.h) + ":" + pad(tpState.m)); closeTimePicker(); }
}
function closeTimePicker() { const el = document.getElementById("timepop"); if (el) el.hidden = true; tpState = null; }
document.addEventListener("click", (e) => { if (tpState && !e.target.closest("#timepop") && !e.target.closest("[data-tp]")) closeTimePicker(); });

function renderModal(kind, data, cat, isEdit) {
  const catSeg = `<div class="seg-cat" id="m-cat">
      <button type="button" data-v="work" class="${cat === "work" ? "active" : ""}"><span class="dot cat-dot work"></span>업무</button>
      <button type="button" data-v="personal" class="${cat === "personal" ? "active" : ""}"><span class="dot cat-dot personal"></span>개인</button>
    </div>`;
  // 추가 창 상단 탭: 일정 | 할 일 | 프로젝트
  const tabs = `<div class="type-tabs">
      <button type="button" data-k="event" class="${kind === "event" ? "active" : ""}">일정</button>
      <button type="button" data-k="todo" class="${kind === "todo" ? "active" : ""}">할 일</button>
      <button type="button" data-k="project" class="${kind === "project" ? "active" : ""}">프로젝트</button>
    </div>`;
  const clockIc = `<svg class="tp-ic" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>`;
  const timeInput = (id, val, ph = "--:--") => `<div class="tp-wrap"><input id="${id}" class="tp-input" readonly value="${esc(val)}" placeholder="${ph}" data-tp/>${clockIc}</div>`;
  const opt = (obj, cur) => Object.entries(obj).map(([v, l]) => `<option value="${v}" ${cur === v ? "selected" : ""}>${l}</option>`).join("");
  const prioSel = (v) => `<select id="f-prio"><option value="urgent" ${v === "urgent" ? "selected" : ""}>긴급</option><option value="high" ${v === "high" ? "selected" : ""}>높음</option><option value="normal" ${v === "normal" ? "selected" : ""}>보통</option></select>`;
  // 일정·할 일: 기존 프로젝트에 연결 (새 프로젝트는 '프로젝트' 탭에서 만듦)
  const projField = `<div class="field"><label for="f-proj">프로젝트</label>
      <select id="f-proj"><option value="">없음</option>${Store.state.projects.map((pr) => `<option value="${pr.id}" ${data.projectId === pr.id ? "selected" : ""}>${esc(pr.name)}</option>`).join("")}${isEdit ? "" : `<option value="__new">＋ 새 프로젝트 만들기…</option>`}</select></div>`;
  let fields;
  if (kind === "project") {
    const np = data._np || {};
    const color = np.color || PROJECT_COLORS[Store.state.projects.length % PROJECT_COLORS.length];
    fields = `
      <div class="field-row pj-name-row">
        <div class="field"><label for="p-name">프로젝트 이름</label><input id="p-name" value="${esc(np.name || "")}" placeholder="예: 신규업체 온보딩" autocomplete="off" /></div>
        <div class="field"><label>분류</label>${catSeg}</div>
      </div>
      <div class="field"><label>색상 <small class="lab-hint">무지개 칸 = 직접 선택</small></label>${projColorPicker("p-colors", color)}</div>
      <div class="field np-steps">
        <div class="field-head"><label for="np-title">단계 (상세 일정)</label><span class="np-cnt" id="np-cnt"></span></div>
        <div class="np-list" id="np-list"></div>
        <div class="np-row">
          <input id="np-title" placeholder="단계 이름 — Enter로 추가" autocomplete="off" />
          <input id="np-date" type="date" />
          ${timeInput("np-time", "", "시간")}
          <button type="button" class="np-add" id="np-add" aria-label="단계 추가">＋</button>
        </div>
        <div class="pj-hint">시간을 넣으면 <b>일정</b>, 비우면 <b>할 일</b>로 만들어져요. 만든 뒤에도 프로젝트 창에서 단계를 더 추가할 수 있어요.</div>
      </div>`;
  } else if (kind === "event") {
    const allDay = !!data.allDay;
    const startV = data.time || "09:00";
    const endV = data.endTime || (isEdit ? "" : addMin(startV, 30));
    const remindV = data.reminder != null ? data.reminder : "0";   // 기본: 정각
    fields = `
      <div class="field"><label for="f-title">제목</label><input id="f-title" value="${esc(data.title || "")}" placeholder="예: 팀 회의" /></div>
      <div class="field-row">
        <div class="field">
          <div class="field-head"><label for="f-date">날짜</label><label class="inline-check"><input type="checkbox" id="f-allday" ${allDay ? "checked" : ""}/> 종일</label></div>
          <input id="f-date" type="date" value="${esc(data.date || todayStr())}" /></div>
        <div class="field" id="time-field" style="${allDay ? "visibility:hidden" : ""}"><label>시작 – 종료</label>
          <div class="time-pair">${timeInput("f-time", startV)}<span class="tp-dash">–</span>${timeInput("f-endtime", endV)}</div></div>
      </div>
      <div class="field-row">
        <div class="field"><label>분류</label>${catSeg}</div>
        <div class="field"><label for="f-prio">우선순위</label>${prioSel(data.priority || "normal")}</div>
      </div>
      <div class="field-row">
        ${projField}
        <div class="field"><label for="f-remind">알림</label><select id="f-remind">${opt(REMIND_LABEL, remindV)}</select></div>
      </div>
      <button type="button" class="more-btn" id="m-more">+ 추가 옵션 (위치·반복·설명)</button>
      <div id="m-extra" hidden>
        <div class="field-row">
          <div class="field"><label for="f-loc">위치</label><input id="f-loc" value="${esc(data.location || "")}" placeholder="예: 2층 회의실 / 온라인" /></div>
          <div class="field"><label for="f-repeat">반복</label><select id="f-repeat">${opt(REPEAT_LABEL, data.repeat || "none")}</select></div>
        </div>
        <div class="field"><label for="f-note">설명</label><textarea id="f-note" placeholder="메모/설명">${esc(data.note || "")}</textarea></div>
      </div>`;
  } else {
    fields = `
      <div class="field"><label for="f-title">할 일</label><input id="f-title" value="${esc(data.title || "")}" placeholder="예: 견적서 확인" /></div>
      <div class="field-row">
        <div class="field"><label for="f-due">마감일</label><input id="f-due" type="date" value="${esc(isEdit ? (data.due || "") : (data.due || data.date || todayStr()))}" /></div>
        <div class="field"><label for="f-prio">우선순위</label>${prioSel(data.priority || "normal")}</div>
      </div>
      <div class="field-row">
        <div class="field"><label>분류</label>${catSeg}</div>
        ${projField}
      </div>
      <div class="field"><label for="f-note">메모</label><textarea id="f-note" placeholder="메모">${esc(data.note || "")}</textarea></div>`;
  }
  const submitLabel = isEdit ? "저장" : kind === "project" ? "프로젝트 만들기" : "추가";
  document.getElementById("modal").innerHTML = `
    <h3>${isEdit ? "수정" : "새로 추가"}</h3>
    ${isEdit ? "" : tabs}
    <form id="m-form">${fields}
      <div class="modal-actions">
        ${isEdit ? `<button type="button" class="btn-del" id="m-del">삭제</button>` : ""}
        <button type="button" class="btn-sub" id="m-cancel">취소</button>
        <button type="submit" class="btn-primary" style="justify-content:center">${submitLabel}</button>
      </div></form>`;

  document.getElementById("modal").className = "modal compact";
  let curCat = cat;
  document.querySelectorAll("#m-cat button").forEach((b) => b.addEventListener("click", () => {
    curCat = b.dataset.v; document.querySelectorAll("#m-cat button").forEach((x) => x.classList.toggle("active", x === b));
  }));
  // 탭 전환: 날짜·분류·제목 유지
  if (!isEdit) document.querySelectorAll(".type-tabs button").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.k === kind) return;
    const tEl = document.getElementById("f-title");
    openModal(b.dataset.k, { date: data.date, time: data.time, cat: curCat, title: tEl ? tEl.value : data.title, _returnProject: data._returnProject });
  }));
  // 시간 선택기 (시계형)
  const endEl = document.getElementById("f-endtime");
  if (endEl) endEl.dataset.auto = data.endTime ? "0" : "1"; // 사용자가 직접 고르기 전엔 시작+30 자동
  document.querySelectorAll("#modal [data-tp]").forEach((inp) => {
    inp.addEventListener("click", () => openTimePicker(inp, (val) => {
      inp.value = val;
      if (inp.id === "f-time" && endEl && endEl.dataset.auto === "1") endEl.value = addMin(val, 30);
      if (inp.id === "f-endtime") endEl.dataset.auto = "0";
    }));
  });
  document.getElementById("m-cancel").addEventListener("click", closeModal);

  /* ----- 프로젝트 탭: 이름·색상·단계를 한 번에 ----- */
  if (kind === "project") {
    const np = data._np || {};
    let color = np.color || PROJECT_COLORS[Store.state.projects.length % PROJECT_COLORS.length];
    const steps = Array.isArray(np.steps) ? np.steps.slice() : [];
    const nextDate = () => {
      const last = [data.date, ...steps.map((x) => x.date)].filter(Boolean).sort().slice(-1)[0];
      return last ? (steps.length ? ymd(addDays(parseYMD(last), 1)) : last) : todayStr();
    };
    // 입력한 단계는 목록에서 바로 수정 (이름·날짜·시간, 시간 지우면 할 일)
    const renderSteps = (resetNext = true) => {
      const list = steps.map((x, i) => ({ ...x, i })).sort((a, b) => a.date.localeCompare(b.date) || (a.time || "").localeCompare(b.time || ""));
      const box = document.getElementById("np-list");
      box.innerHTML = list.map((x, n) => `<div class="np-item" data-i="${x.i}">
          <span class="np-n">${n + 1}</span>
          <input class="np-et" value="${esc(x.title)}" aria-label="단계 이름" title="눌러서 수정" />
          <input class="np-ed" type="date" value="${x.date}" aria-label="날짜" />
          <span class="np-tw"><input class="np-etm tp-input" readonly data-tp value="${x.time || ""}" placeholder="시간" aria-label="시간" />${x.time ? `<button type="button" class="np-tclr" title="시간 지우기 (할 일로)">×</button>` : ""}</span>
          <button type="button" class="np-del" aria-label="단계 삭제" title="단계 삭제">×</button></div>`).join("");
      box.querySelectorAll(".np-item").forEach((row) => {
        const i = +row.dataset.i, t = row.querySelector(".np-et");
        t.addEventListener("input", () => { if (t.value.trim()) steps[i].title = t.value.trim(); });
        t.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); t.blur(); } });
        t.addEventListener("blur", () => { if (!t.value.trim()) t.value = steps[i].title; });
        row.querySelector(".np-ed").addEventListener("change", (ev) => { if (ev.target.value) { steps[i].date = ev.target.value; renderSteps(false); } });
        const tm = row.querySelector(".np-etm");
        tm.addEventListener("click", () => openTimePicker(tm, (v) => { steps[i].time = v; renderSteps(false); }));
        const clr = row.querySelector(".np-tclr"); if (clr) clr.addEventListener("click", () => { steps[i].time = ""; renderSteps(false); });
        row.querySelector(".np-del").addEventListener("click", () => { steps.splice(i, 1); renderSteps(); });
      });
      document.getElementById("np-cnt").textContent = steps.length ? `${steps.length}개 · 눌러서 수정` : "";
      if (resetNext) document.getElementById("np-date").value = nextDate();
    };
    const addStep = () => {
      const tEl = document.getElementById("np-title"), title = tEl.value.trim();
      if (!title) { tEl.focus(); return false; }
      const tm = document.getElementById("np-time");
      steps.push({ title, date: document.getElementById("np-date").value || nextDate(), time: tm.value || "" });
      tEl.value = ""; tm.value = ""; renderSteps(); tEl.focus(); return true;
    };
    renderSteps();
    wireColorPicker("p-colors", (c) => { color = c; });
    document.getElementById("np-add").addEventListener("click", addStep);
    document.getElementById("np-title").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); addStep(); } });
    document.getElementById("p-name").addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); document.getElementById("np-title").focus(); } });
    document.getElementById("m-form").addEventListener("submit", (ev) => {
      ev.preventDefault();
      const nameEl = document.getElementById("p-name"), name = nameEl.value.trim();
      if (!name) { nameEl.focus(); toast("프로젝트 이름을 입력하세요"); return; }
      if (document.getElementById("np-title").value.trim()) addStep();   // 입력만 하고 ＋를 안 누른 단계도 포함
      const pid = Store.addProject({ name, color });
      steps.forEach((x) => {
        if (x.time) Store.addEvent({ title: x.title, date: x.date, time: x.time, endTime: addMin(x.time, 30), cat: curCat, priority: "normal", reminder: "0", projectId: pid });
        else Store.addTodo({ title: x.title, due: x.date, cat: curCat, priority: "normal", projectId: pid });
      });
      returnToProject = null; closeModal();
      openProject(pid);   // 만든 프로젝트 창을 바로 열어 확인·추가
      toast(steps.length ? `프로젝트를 만들었습니다 — 단계 ${steps.length}개` : "프로젝트를 만들었습니다 — 단계를 추가하세요");
    });
    setTimeout(() => document.getElementById("p-name").focus(), 30);
    return;
  }

  /* ----- 일정 / 할 일 ----- */
  const projSel = document.getElementById("f-proj");
  // '새 프로젝트 만들기' → 프로젝트 탭으로 이동, 지금 적던 항목을 1단계로 가져감
  projSel.addEventListener("change", () => {
    if (projSel.value !== "__new") return;
    const title = document.getElementById("f-title").value.trim();
    const date = (document.getElementById(kind === "event" ? "f-date" : "f-due") || {}).value || todayStr();
    const allDay = kind === "event" && document.getElementById("f-allday").checked;
    const time = kind === "event" && !allDay ? document.getElementById("f-time").value : "";
    openModal("project", { date, cat: curCat, _returnProject: data._returnProject, _np: { steps: title ? [{ title, date, time }] : [] } });
    toast(title ? `'${title}'을(를) 1단계로 가져왔어요` : "새 프로젝트를 만들어요");
  });
  const allDayEl = document.getElementById("f-allday");
  if (allDayEl) allDayEl.addEventListener("change", () => { document.getElementById("time-field").style.visibility = allDayEl.checked ? "hidden" : ""; });
  // [추가 옵션] 접기/펼치기 (편집 시 값이 있으면 자동 펼침)
  const moreBtn = document.getElementById("m-more");
  if (moreBtn) {
    const extra = document.getElementById("m-extra");
    if (isEdit && (data.location || (data.repeat && data.repeat !== "none") || data.note)) { extra.hidden = false; moreBtn.style.display = "none"; }
    moreBtn.addEventListener("click", () => { extra.hidden = !extra.hidden; moreBtn.textContent = extra.hidden ? "+ 추가 옵션 (위치·반복·설명)" : "− 추가 옵션 접기"; });
  }
  const del = document.getElementById("m-del");
  if (del) del.addEventListener("click", () => {
    if (!confirm(kind === "event" && document.getElementById("f-repeat") && document.getElementById("f-repeat").value !== "none"
      ? "반복 일정 전체를 삭제할까요?" : "삭제할까요?")) return;
    if (kind === "event") Store.deleteEvent(modalState.id); else Store.deleteTodo(modalState.id);
    closeModal(); toast(kind === "event" ? "일정을 삭제했습니다" : "할 일을 삭제했습니다");
  });
  document.getElementById("m-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const title = document.getElementById("f-title").value.trim();
    if (!title) { document.getElementById("f-title").focus(); return; }
    const prevObj = modalState.id ? (kind === "event" ? Store.state.events : Store.state.todos).find((x) => x.id === modalState.id) : null;
    const prevDate = prevObj ? (kind === "event" ? prevObj.date : prevObj.due) : null, prevPid = prevObj ? prevObj.projectId : null;
    const projectId = projSel.value && projSel.value !== "__new" ? projSel.value : null;
    if (kind === "event") {
      const allDay = document.getElementById("f-allday").checked;
      const reminder = document.getElementById("f-remind").value;
      const payload = { title, cat: curCat, allDay,
        date: document.getElementById("f-date").value || todayStr(),
        time: allDay ? "" : (document.getElementById("f-time").value || ""),
        endTime: allDay ? "" : (document.getElementById("f-endtime").value || ""),
        location: document.getElementById("f-loc").value.trim(),
        note: document.getElementById("f-note").value.trim(),
        repeat: document.getElementById("f-repeat").value,
        priority: document.getElementById("f-prio").value, reminder, projectId };
      if (reminder !== "none") requestNotify();
      if (modalState.id) Store.updateEvent(modalState.id, payload); else Store.addEvent(payload);
      toast(modalState.id ? "일정을 수정했습니다" : "일정을 추가했습니다");
    } else {
      const payload = { title, cat: curCat, due: document.getElementById("f-due").value || null,
        priority: document.getElementById("f-prio").value, note: document.getElementById("f-note").value.trim(), projectId };
      if (modalState.id) Store.updateTodo(modalState.id, payload); else Store.addTodo(payload);
      toast(modalState.id ? "할 일을 수정했습니다" : "할 일을 추가했습니다");
    }
    const editedId = modalState.id, newDate = kind === "event" ? document.getElementById("f-date").value : document.getElementById("f-due").value;
    closeModal();
    // 프로젝트 단계를 뒤로 미뤘으면 뒤 단계도 같이 밀지 확인
    if (editedId && projectId && projectId === prevPid) offerCascade(projectId, editedId, prevDate, newDate);
  });
  setTimeout(() => { const el = document.getElementById("f-title"); if (el) el.focus(); }, 30);
}

/* ---------- 프로젝트 상세 창 (단계 추가·체크·편집) ---------- */
function openProject(pid) {
  modalState = { kind: "project", id: pid || null };
  renderProjectModal(pid);
  document.getElementById("modal-backdrop").classList.add("open");
}
function renderProjectModal(pid) {
  const p = projectById(pid), isNew = !p;
  const color = p ? p.color : PROJECT_COLORS[Store.state.projects.length % PROJECT_COLORS.length];
  const m = document.getElementById("modal");
  m.className = "modal proj-modal";

  const clock = `<svg class="tp-ic" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>`;
  let body = "";
  if (!isNew) {
    const st = projectStats(pid), today = todayStr();
    const last = st.items.filter((x) => x.date).slice(-1)[0];
    const rows = st.items.map((x, i) => {
      const late = !x.done && x.rolledFrom ? daysBetween(x.rolledFrom, today) : 0;
      const moved = x.planned && x.date && x.planned !== x.date;
      const dt = x.date ? `${moved ? `<s title="처음 계획">${fmtMD(x.planned)}</s> ` : ""}<b>${fmtMD(x.date)}</b>${x.time ? ` ${x.time}` : ""}` : `<span class="muted">날짜 없음</span>`;
      const ms = x === last && st.items.length > 1;
      const ck = x.kind === "todo" ? `data-pj-toggle="${x.id}"` : `data-pj-ev-toggle="${x.id}"`;
      return `<div class="pj-row ${x.done ? "done" : ""} ${x === st.next ? "cur" : ""}">
        <span class="pj-num">${i + 1}</span>
        <span class="pj-ck ${x.done ? "on" : ""}" ${ck} title="완료 표시">${x.done ? IC.check : ""}</span>
        <span class="pj-t" data-pj-edit="${x.kind}:${x.id}" title="눌러서 수정">${x.kind === "event" ? '<i class="pj-kind">일정</i>' : ""}${esc(x.title)}${ms ? ' <em class="pj-ms">◆ 마일스톤</em>' : ""}${late ? ` <em class="pj-d">지연 D+${late}</em>` : ""}${x === st.next && !late ? ' <em class="pj-now">진행중</em>' : ""}</span>
        <span class="pj-dt">${dt}</span>
      </div>`;
    }).join("") || `<div class="pj-empty">아직 단계가 없습니다. 아래에서 첫 단계를 추가하세요.</div>`;
    const defDate = st.end && st.end >= today ? ymd(addDays(parseYMD(st.end), 1)) : today;
    body = `
      <div class="pj-sum" style="--pc:${color}">
        <div class="pj-prog"><i style="width:${st.pct}%"></i></div>
        <div class="pj-meta"><b>${st.done}/${st.total} 완료 · ${st.pct}%</b>${st.start ? `<span>${fmtMD(st.start)} → ${fmtMD(st.end)}</span>` : ""}${st.delay ? `<span class="pj-d">지연 D+${st.delay}</span>` : ""}</div>
      </div>
      <div class="pj-steps" id="pj-steps">${rows}</div>
      <div class="pj-add">
        <div class="pj-add-h">＋ 단계 추가</div>
        <input id="pj-s-title" placeholder="단계 이름 (예: 계약 검토)" autocomplete="off" />
        <div class="pj-add-row">
          <input id="pj-s-date" type="date" value="${defDate}" />
          <div class="tp-wrap"><input id="pj-s-time" class="tp-input" readonly placeholder="시간(선택)" data-tp />${clock}</div>

      </div>`;
  }
  m.innerHTML = `
    <h3>${isNew ? "새 프로젝트" : "프로젝트"}</h3>
    <div class="field"><label>이름</label><input id="pj-name" value="${esc(p ? p.name : "")}" placeholder="예: 신규업체 온보딩" autocomplete="off" /></div>
    <div class="field"><label>색상 <small class="lab-hint">무지개 칸 = 직접 선택</small></label>${projColorPicker("pj-colors", color)}</div>
    ${isNew ? `<p class="pj-hint" style="margin:-2px 0 12px">만든 뒤 바로 단계(상세 일정)를 추가할 수 있어요. 기존 일정·할 일은 입력창의 <b>프로젝트</b> 칸에서 연결할 수 있습니다.</p>` : ""}
    ${body}
    <div class="modal-actions">
      ${isNew ? "" : `<button type="button" class="btn-del" id="pj-del">프로젝트 삭제</button>`}
      <button type="button" class="btn-sub" id="pj-close">닫기</button>
      <button type="button" class="btn-primary" id="pj-save" style="justify-content:center">${isNew ? "만들기" : "저장"}</button>
    </div>`;

  let curColor = color;
  const nameEl = document.getElementById("pj-name");
  const saveMeta = () => { if (p) Store.updateProject(p.id, { name: nameEl.value.trim() || p.name, color: curColor }); };
  wireColorPicker("pj-colors", (c, final) => {
    curColor = c;
    const sum = m.querySelector(".pj-sum"); if (sum) sum.style.setProperty("--pc", curColor);
    if (p && final) saveMeta();
  });
  nameEl.addEventListener("change", saveMeta);
  document.getElementById("pj-close").addEventListener("click", () => { saveMeta(); closeModal(); });
  document.getElementById("pj-save").addEventListener("click", () => {
    const nm = nameEl.value.trim();
    if (!nm) { nameEl.focus(); return; }
    if (isNew) {
      const id = Store.addProject({ name: nm, color: curColor });
      modalState = { kind: "project", id };
      renderProjectModal(id); toast("프로젝트를 만들었습니다 — 단계를 추가하세요");
      setTimeout(() => { const t = document.getElementById("pj-s-title"); if (t) t.focus(); }, 30);
    } else { saveMeta(); closeModal(); toast("프로젝트를 저장했습니다"); }
  });

    if (!confirm(`'${p.name}' 프로젝트를 삭제할까요?\n연결된 일정·할 일은 지워지지 않고 일반 항목으로 남습니다.`)) return;
    Store.deleteProject(p.id); closeModal(); toast("프로젝트를 삭제했습니다");
  });
  if (isNew) { setTimeout(() => nameEl.focus(), 30); return; }

  // 단계 목록: 완료 체크 / 눌러서 편집
  document.getElementById("pj-steps").addEventListener("click", (e) => {
    const tg = e.target.closest("[data-pj-toggle]"); if (tg) { Store.toggleTodo(tg.dataset.pjToggle); renderProjectModal(p.id); return; }
    const te = e.target.closest("[data-pj-ev-toggle]"); if (te) { Store.toggleEvent(te.dataset.pjEvToggle); renderProjectModal(p.id); return; }
    const ed = e.target.closest("[data-pj-edit]");
    if (ed) {
      const [kind, id] = ed.dataset.pjEdit.split(":");
      const obj = (kind === "event" ? Store.state.events : Store.state.todos).find((x) => x.id === id);
      if (obj) openModal(kind, { ...obj, _returnProject: p.id });

/* ---------- 렌더: 프로젝트 목록 ---------- */
function renderProjects() {
  const list = Store.state.projects.map((p) => ({ p, st: projectStats(p.id) }))
    .sort((a, b) => ((a.st.total && a.st.pct === 100) - (b.st.total && b.st.pct === 100)) || (a.st.start || "9999").localeCompare(b.st.start || "9999"));
  let html = `<div class="view-head"><div><h2>프로젝트</h2><div class="sub">단계가 이어지는 일정·할 일 묶음 · 앞 단계가 밀리면 뒤 단계도 자동으로 밀립니다</div></div>
    <button class="btn-primary" id="pj-new">＋ 새 프로젝트</button></div>`;
  if (!list.length) return html + `<div class="empty">아직 프로젝트가 없습니다.<br>＋ 새 프로젝트로 시작하거나, 일정·할 일 입력창의 <b>프로젝트</b> 칸에서 바로 만들 수 있어요.</div>`;
  const isDone = (st) => st.total && st.done === st.total;
  const active = list.filter(({ st }) => !isDone(st)), done = list.filter(({ st }) => isDone(st));
  const cards = (arr) => `<div class="pj-cards">` + arr.map(({ p, st }) => `
    <div class="pj-card ${isDone(st) ? "is-done" : ""}" data-proj="${p.id}" style="--pc:${p.color}">
      <div class="pj-card-h"><span class="pj-name">${esc(p.name)}</span>${st.delay ? `<span class="pj-d">지연 D+${st.delay}</span>` : ""}${st.total && st.pct === 100 ? `<span class="pj-doneb">완료</span>` : ""}</div>
      <div class="pj-prog"><i style="width:${st.pct}%"></i></div>
      <div class="pj-meta"><b>${st.done}/${st.total} · ${st.pct}%</b><span>${st.start ? `${fmtMD(st.start)} → ${fmtMD(st.end)}` : "단계 없음"}</span></div>
      <div class="pj-mini">${st.items.map((x) => `<span class="${x.done ? "on" : ""} ${!x.done && x.rolledFrom ? "late" : ""}" title="${esc(x.title)}"></span>`).join("")}</div>
      ${st.next ? `<div class="pj-next">다음 · <b>${esc(st.next.title)}</b>${st.next.date ? ` · ${fmtMD(st.next.date)}` : ""}</div>` : ""}
    </div>`).join("") + `</div>`;
  html += `<p class="panel-title">진행 중 · ${active.length}</p>` + (active.length ? cards(active) : `<div class="empty">진행 중인 프로젝트가 없습니다.</div>`);
  if (done.length) html += `<p class="panel-title" style="margin-top:22px">완료된 프로젝트 · ${done.length} <small class="lab-hint">캘린더에서는 숨겨집니다</small></p>` + cards(done);
  return html;
}

/* ---------- 위젯 설정: 테마 색상 · 투명도 · 대비 · 세부 글자크기 · 알림 ---------- */
const THEMES = {
  cream:    { name: "기본", dot: "#EAE6DC", bg: "#F4F1EA", surface: "#FFFDF8", s2: "#EFEBE1", s3: "#E6E1D4", work: "#2F5D62" },
  white:    { name: "화이트", dot: "#FFFFFF", bg: "#F3F4F6", surface: "#FFFFFF", s2: "#EDEEF1", s3: "#E3E5E9", work: "#3A4048" },
  pink:     { name: "핑크", dot: "#EFA9BE", bg: "#FBEEF3", surface: "#FFF7FA", s2: "#F6E3EB", s3: "#EFD3DF", work: "#C25B7E" },
  sky:      { name: "하늘색", dot: "#8FC0EA", bg: "#EAF1FB", surface: "#F6FAFF", s2: "#DEE9F7", s3: "#CDDDF1", work: "#3E77B5" },
  mint:     { name: "민트", dot: "#8CCBAE", bg: "#E8F5EE", surface: "#F4FBF7", s2: "#DAEEE3", s3: "#C9E6D5", work: "#2F8F6B" },
  lavender: { name: "라벤더", dot: "#B3A6E3", bg: "#F0ECFA", surface: "#F9F6FF", s2: "#E5DEF6", s3: "#D7CDEF", work: "#6E5FB0" },
};
const PAPER_STYLES = ["none", "grid", "ruled", "excel", "dot"];
const PAPER_LABEL = { none: "없음", grid: "모눈", ruled: "유선", excel: "엑셀", dot: "도트" };
const prefs = { paperStyle: "grid", theme: "cream", panelOp: 92, contrast: "auto", calScale: 100, alertScale: 100, alertSec: 0 };
function loadPrefs() {
  try {
    const p = JSON.parse(localStorage.getItem("scheduler:prefs") || "{}");
    if (PAPER_STYLES.includes(p.paperStyle)) prefs.paperStyle = p.paperStyle;
    else if (typeof p.paper === "boolean") prefs.paperStyle = p.paper ? "grid" : "none"; // 구버전 호환
    if (p.theme && THEMES[p.theme]) prefs.theme = p.theme;
    if (Number.isFinite(p.panelOp)) prefs.panelOp = Math.max(60, Math.min(100, p.panelOp));
    if (p.contrast === "strong" || p.contrast === "auto") prefs.contrast = p.contrast;
    if (Number.isFinite(p.calScale)) prefs.calScale = Math.max(70, Math.min(150, p.calScale));
    if (Number.isFinite(p.alertScale)) prefs.alertScale = Math.max(70, Math.min(160, p.alertScale));
    if (Number.isFinite(p.alertSec)) prefs.alertSec = Math.max(0, Math.min(120, p.alertSec));
  } catch (e) {}
}
function savePrefs() { try { localStorage.setItem("scheduler:prefs", JSON.stringify(prefs)); } catch (e) {} }
function applyThemeColors() {
  const t = THEMES[prefs.theme] || THEMES.cream;
  const el = document.documentElement;
  const dark = currentDark();
  const base = dark ? "#1c1f22" : "#ffffff";
  el.style.setProperty("--work", t.work);
  el.style.setProperty("--work-soft", `color-mix(in srgb, ${t.work} 12%, ${base})`);
  el.style.setProperty("--work-line", `color-mix(in srgb, ${t.work} 30%, ${base})`);
  if (!dark) {
    el.style.setProperty("--bg", t.bg);
    el.style.setProperty("--surface", t.surface);
    el.style.setProperty("--surface-2", t.s2);
    el.style.setProperty("--surface-3", t.s3);
  } else {
    ["--bg", "--surface", "--surface-2", "--surface-3"].forEach((v) => el.style.removeProperty(v));
  }
}
function applyPrefs() {
  PAPER_STYLES.forEach((s) => document.body.classList.toggle("paper-" + s, prefs.paperStyle === s));
  document.body.classList.toggle("contrast-strong", prefs.contrast === "strong");
  const el = document.documentElement;
  el.style.setProperty("--panel-op", prefs.panelOp + "%");
  el.style.setProperty("--cal-scale", (prefs.calScale / 100).toFixed(3));
  el.style.setProperty("--alert-scale", (prefs.alertScale / 100).toFixed(3));
  applyThemeColors();
}
function setPref(key, val) { prefs[key] = val; savePrefs(); applyPrefs(); }

/* ---------- 알림 (지속형 팝업 + 브라우저 Notification 백업) ---------- */
let reminderTimers = [];
const firedAlerts = new Set();   // 이미 뜬 알림(중복 방지)
const snoozeTimers = {};
function requestNotify() { try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {} }

// 컴퓨터(로컬) 시간 기준으로 알림 예약. 앱/PiP가 열려 있는 동안 동작.
function scheduleReminders() {
  reminderTimers.forEach(clearTimeout); reminderTimers = [];
  const now = Date.now();
  [0, 1].forEach((off) => {
    const ds = ymd(addDays(new Date(), off));
    eventsOn(ds).forEach((e) => {
      if (e.allDay || !e.time || !e.reminder || e.reminder === "none") return;
      const dt = new Date(`${ds}T${e.time.length === 5 ? e.time : "09:00"}:00`);
      const fire = dt.getTime() - parseInt(e.reminder, 10) * 60000;
      const key = e._base + "@" + ds;
      if (fire > now && fire - now < 26 * 3600 * 1000 && !firedAlerts.has(key)) {
        reminderTimers.push(setTimeout(() => fireAlert(e, key), fire - now));
      }
    });
  });
}
function fireAlert(e, key) {
  firedAlerts.add(key);
  const title = "일정 알림: " + e.title;
  const body = `${evTimeText(e)} ${e.location || ""}`.trim();
  osNotify(title, body, key) || showAlertCard(e, key); // OS 팝업 실패 시 앱 내부 팝업
}
// 윈도우(OS) 시스템 팝업 — 서비스워커로 확인/30분/1시간 액션 버튼 포함, 확인 전까지 유지
function osNotify(title, body, key) {
  try {
    if (!("Notification" in window) || Notification.permission !== "granted" || !navigator.serviceWorker) return false;
    navigator.serviceWorker.ready.then((reg) => {
      reg.showNotification(title, {
        body, tag: key, requireInteraction: true, icon: "icon-192.png",
        actions: [{ action: "s30", title: "30분 뒤" }, { action: "s60", title: "1시간 뒤" }],
        data: { key, title, body },
      });
    }).catch(() => {});
    return true;
  } catch (_) { return false; }
}
// 우측 지속형 팝업 — 확인/30분/1시간 액션 전까지 사라지지 않음
function showAlertCard(e, key) {
  const stacks = [document.getElementById("alert-stack")];
  if (pipWin && pipWin.document) { const s = pipWin.document.getElementById("alert-stack"); if (s) stacks.push(s); }
  const host = stacks[0];
  const card = document.createElement("div");
  card.className = "alert-card";
  if (prefs.alertScale && prefs.alertScale !== 100) card.style.zoom = (prefs.alertScale / 100).toFixed(3);
  card.innerHTML = `<div class="ac-head"><span class="ac-badge">${IC.bell}알림</span><span class="ac-time">${esc(evTimeText(e))}</span></div>
    <div class="ac-title">${esc(e.title)}</div>${e.location ? `<div class="ac-loc">${esc(e.location)}</div>` : ""}
    <div class="ac-actions"><button data-a="ok" class="ac-ok">확인</button><button data-a="30">30분 뒤</button><button data-a="60">1시간 뒤</button></div>`;
  card.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    card.remove();
    if (b.dataset.a === "30" || b.dataset.a === "60") {
      const mins = parseInt(b.dataset.a, 10);
      clearTimeout(snoozeTimers[key]);
      snoozeTimers[key] = setTimeout(() => showAlertCard(e, key), mins * 60000);
      toast(`${mins}분 뒤 다시 알림`);
    }
  });
  host.appendChild(card);
  // 표기 시간(초)이 설정되어 있으면 자동으로 닫힘 (0 = 확인 전까지 유지)
  if (prefs.alertSec && prefs.alertSec > 0) {
    setTimeout(() => { if (card.isConnected) card.remove(); }, prefs.alertSec * 1000);
  }
}

/* ---------- 백업 ---------- */
function exportData() {
  const blob = new Blob([Store.exportJSON()], { type: "application/json" });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = `scheduler-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000); toast("백업 파일을 내보냈습니다");
}
function importData() {
  const input = document.createElement("input"); input.type = "file"; input.accept = "application/json,.json";
  input.addEventListener("change", () => {
    const file = input.files && input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { const d = JSON.parse(reader.result); toast(Store.replaceAll(d) ? "백업을 복원했습니다" : "올바른 백업 파일이 아닙니다"); } catch (e) { toast("파일을 읽을 수 없습니다"); } };
    reader.readAsText(file);
  });
  input.click();
}

/* ---------- 핀: 오늘 할 일 고정 ----------
   지원 브라우저(크롬 등)에서는 Document Picture-in-Picture로 '항상 위'에 뜨는
   실제 창을 띄웁니다. 미지원 시 앱 내부 플로팅 위젯으로 대체합니다. */
const pinState = { open: false, collapsed: false, opacity: 100, x: null, y: null, doneOpen: false };
let pipWin = null;
function pipSupported() { return "documentPictureInPicture" in window; }
function loadPin() { try { const p = JSON.parse(localStorage.getItem("scheduler:pin") || "{}"); Object.assign(pinState, p); pinState.open = false; pinState.doneOpen = false; } catch (e) {} }
function savePin() { try { localStorage.setItem("scheduler:pin", JSON.stringify(pinState)); } catch (e) {} }

// 핀/항상위: 미완료 할 일(어제까지 못한 것 + 오늘 + 그 사이 추가) → 구분선 → 오늘 일정(이월 포함)
function pinItemsHtml() {
  const today = todayStr();
  const todos = Store.state.todos.filter((t) => !t.done && (!t.due || t.due <= today))
    .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || PRIO[a.priority].rank - PRIO[b.priority].rank);
  const events = todayAgendaEvents();
  let h = `<div class="pin-sec">할 일 · ${todos.length}</div>`;
  h += todos.length ? todos.map((t) => {
    const late = t.rolledFrom ? `<span class="dd">D+${daysBetween(t.rolledFrom, today)}</span>` : (t.due && t.due < today ? `<span class="dd">D+${daysBetween(t.due, today)}</span>` : "");
    return `<div class="pin-todo pri-${t.priority}">
      <div class="box" data-pin-toggle="${t.id}"></div>
      <div class="pin-tx" data-pin-edit-todo="${t.id}"><div class="t">${late}${esc(t.title)}</div><div class="m">${t.due ? fmtDueMeta(t.due) : "기한 없음"} · ${PRIO[t.priority].label}${projTag(t.projectId)}</div></div>
    </div>`;
  }).join("") : `<div class="pin-empty">${IC.check} 할 일 없음</div>`;
  h += `<div class="pin-divider">오늘 일정</div>`;
  h += events.length ? events.map((e) => {
    const dd = e._delay ? `<span class="dd">D+${e._delay}</span>` : "";
    return `<div class="pin-todo pri-${e.priority}">
      <div class="box" data-pin-ev-toggle="${e._base || e.id}"></div>
      <div class="pin-tx" data-pin-edit-event="${e._base || e.id}"><div class="t">${dd}${catIcon(e.cat)} ${esc(e.title)}</div><div class="m">${esc(evTimeText(e))}${e.location ? " · " + esc(e.location) : ""}${projTag(e.projectId)}</div></div>
    </div>`;
  }).join("") : `<div class="pin-empty">오늘 일정 없음</div>`;

  // 완료 섹션 — 되돌리기(체크 해제) 가능, 1주일 지난 항목은 자동 삭제됨
  const doneItems = [

/* ---------- 캘린더 드래그 앤 드롭 ---------- */
let dragData = null;
// 드래그앤드롭: 시간 칸에서는 30분 단위로 스냅 (잡은 위치 기준) + 이동 미리보기
const hmToMin = (t) => { const [a, b] = (t || "0:0").split(":").map(Number); return a * 60 + (b || 0); };
const minToHM = (m) => pad(Math.floor(m / 60)) + ":" + pad(m % 60);
const DAY_MIN = 8 * 60, DAY_MAX = 20 * 60 + 30;   // 캘린더에 보이는 8:00 ~ 20:30 시작 범위
function evDurMin(ev) { if (ev && ev.time && ev.endTime) { const d = hmToMin(ev.endTime) - hmToMin(ev.time); if (d > 0) return d; } return 30; }
function dropStartMin(cell, clientY) {
  const r = cell.getBoundingClientRect();
  const raw = parseInt(cell.dataset.hour, 10) * 60 + ((clientY - r.top) / r.height) * 60 - (dragData.grabMin || 0);
  const snapped = dragData.grabMin ? Math.round(raw / 30) * 30 : Math.floor(raw / 30) * 30; // 잡은 블록은 가장 가까운 30분, 칩은 커서가 있는 30분 칸
  return Math.max(DAY_MIN, Math.min(DAY_MAX, snapped));
}
function showDropGhost(grid, date, startMin) {
  const cell = grid.querySelector(`.cell[data-date="${date}"][data-hour="${pad(Math.floor(startMin / 60))}:00"]`);
  let g = grid.querySelector(".drop-ghost");
  if (!cell) { if (g) g.remove(); return; }
  if (!g) { g = document.createElement("div"); g.className = "drop-ghost"; }
  if (g.parentNode !== cell) {
    grid.querySelectorAll(".drop-target").forEach((c) => c.classList.remove("drop-target"));
    cell.appendChild(g); cell.classList.add("drop-target");
  }
  g.style.top = ((startMin % 60) / 60) * 100 + "%";
  g.style.height = (dragData.dur / 60) * 100 + "%";
  g.textContent = minToHM(startMin) + "–" + minToHM(Math.min(startMin + dragData.dur, 23 * 60 + 59));
}
function clearDropUI(grid) {
  grid.querySelectorAll(".drop-ghost").forEach((g) => g.remove());
  grid.querySelectorAll(".drop-target, .drop-hover").forEach((c) => c.classList.remove("drop-target", "drop-hover"));
}
// 일정 블록 위/아래 가장자리를 끌어 시간 늘이기·줄이기 (30분 단위, 최소 30분)
let rzState = null, suppressClickUntil = 0;
function fmtDur(m) { const h = Math.floor(m / 60), r = m % 60; return (h ? h + "시간" : "") + (h && r ? " " : "") + (r ? r + "분" : ""); }
function wireCalendarResize(grid) {
  grid.querySelectorAll(".evt.timed .rz").forEach((h) => {
    h.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      e.preventDefault(); e.stopPropagation();
      const el = h.closest(".evt"), cell = el.closest(".cell");
      const ev = Store.state.events.find((x) => x.id === el.dataset.id);
      if (!ev || !ev.time || !cell) return;
      const sM = hmToMin(ev.time), eM = ev.endTime && hmToMin(ev.endTime) > sM ? hmToMin(ev.endTime) : sM + 30;
      rzState = { el, cell, id: ev.id, edge: h.dataset.rz, sM, eM, ns: sM, ne: eM, y0: e.clientY,
        rectH: cell.getBoundingClientRect().height, cssH: parseFloat(getComputedStyle(cell).height) || 46, hour: parseInt(cell.dataset.hour, 10) };
      el.classList.add("resizing"); cell.classList.add("rz-active");
      try { h.setPointerCapture(e.pointerId); } catch (_) {}
    });
    h.addEventListener("pointermove", (e) => {
      const st = rzState; if (!st || st.el !== h.closest(".evt")) return;
      const d = ((e.clientY - st.y0) / st.rectH) * 60;
      const snap = (m) => Math.round(m / 30) * 30;
      if (st.edge === "bot") st.ne = Math.max(st.sM + 30, Math.min(Math.max(st.eM, 21 * 60), snap(st.eM + d)));
      else st.ns = Math.min(st.eM - 30, Math.max(Math.min(st.sM, DAY_MIN), snap(st.sM + d)));
      st.el.style.top = ((st.ns - st.hour * 60) / 60) * st.cssH + "px";
      st.el.style.height = ((st.ne - st.ns) / 60) * st.cssH - 2 + "px";
      const t = st.el.querySelector(".t"); if (t) t.textContent = `${minToHM(st.ns)}–${minToHM(st.ne)} · ${fmtDur(st.ne - st.ns)}`;
    });
    const finish = () => {
      const st = rzState; if (!st) return;
      rzState = null; suppressClickUntil = Date.now() + 400;   // 끌기 직후 클릭(편집창 열림) 방지
      st.el.classList.remove("resizing"); st.cell.classList.remove("rz-active");
      if (st.ns !== st.sM || st.ne !== st.eM) {
        Store.updateEvent(st.id, { time: minToHM(st.ns), endTime: minToHM(st.ne) });
        toast(`${minToHM(st.ns)}–${minToHM(st.ne)} (${fmtDur(st.ne - st.ns)})로 변경했습니다`);
      } else { const t = st.el.querySelector(".t"); if (t) t.textContent = `${minToHM(st.sM)}–${minToHM(st.eM)}`; }
    };
    h.addEventListener("pointerup", finish);
    h.addEventListener("pointercancel", finish);
  });
}
function wireCalendarDnD() {
  const grid = document.querySelector(".week-grid"); if (!grid) return;
  wireCalendarResize(grid);
  grid.querySelectorAll("[data-drag]").forEach((el) => {
    el.addEventListener("dragstart", (e) => {
      if (rzState || (e.target.closest && e.target.closest(".rz"))) { e.preventDefault(); return; }   // 크기 조절 중엔 이동 드래그 안 함
      dragData = { type: el.dataset.drag, id: el.dataset.id, grabMin: 0, dur: 30 };
      if (dragData.type === "event") {
        dragData.dur = evDurMin(Store.state.events.find((x) => x.id === el.dataset.id));
        const c = el.classList.contains("timed") && el.closest(".cell");
        if (c) { const er = el.getBoundingClientRect(), cr = c.getBoundingClientRect(); dragData.grabMin = Math.max(0.5, ((e.clientY - er.top) / cr.height) * 60); }
      }
      el.classList.add("dragging");
      try { e.dataTransfer.setData("text/plain", el.dataset.id); e.dataTransfer.effectAllowed = "move"; } catch (_) {}
    });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragData = null; clearDropUI(grid); });
  });
  grid.querySelectorAll(".cell, .band-cell").forEach((cell) => {
    const isBand = cell.dataset.band === "1";
    cell.addEventListener("dragover", (e) => {

      if (dragData.type === "event" && !isBand) {
        grid.querySelectorAll(".drop-hover").forEach((c) => c.classList.remove("drop-hover"));
        showDropGhost(grid, cell.dataset.date, dropStartMin(cell, e.clientY));
      } else {
        grid.querySelectorAll(".drop-ghost").forEach((g) => g.remove());
        cell.classList.add("drop-hover");
      }
    });
    cell.addEventListener("dragleave", () => cell.classList.remove("drop-hover"));
    cell.addEventListener("drop", (e) => {
      e.preventDefault(); if (!dragData) return;
      const date = cell.dataset.date;
      const startMin = !isBand && dragData.type === "event" ? dropStartMin(cell, e.clientY) : 0;
      clearDropUI(grid);
      if (dragData.type === "todo") {
        const td = Store.state.todos.find((x) => x.id === dragData.id);
        const oldDue = td && td.due, pid = td && td.projectId;
        Store.updateTodo(dragData.id, { due: date }); toast("할 일을 옮겼습니다");
        offerCascade(pid, dragData.id, oldDue, date);
      } else if (dragData.type === "event") {
        const ev = Store.state.events.find((x) => x.id === dragData.id); if (!ev) return;
        const oldDate = ev.date, pid = ev.projectId, evId = dragData.id;
        setTimeout(() => offerCascade(pid, evId, oldDate, date), 0);
        if (isBand) { Store.updateEvent(evId, { date, allDay: true, time: "", endTime: "" }); toast("종일 일정으로 옮겼습니다"); }
        else {
          const time = minToHM(startMin), endTime = minToHM(Math.min(startMin + dragData.dur, 23 * 60 + 59));
          Store.updateEvent(evId, { date, allDay: false, time, endTime });
          toast(`${fmtMD(date)} ${time}–${endTime}로 옮겼습니다`);
        }
      }
    });
  });
}

  backdrop.addEventListener("click", (e) => { if (e.target === backdrop && downOnBackdrop) closeModal(); downOnBackdrop = false; });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" && e.key !== "Esc") return;
    const tp = document.getElementById("timepop");
    if (tp && !tp.hidden) { closeTimePicker(); e.preventDefault(); return; }
    if (document.getElementById("modal-backdrop").classList.contains("open")) { closeModal(); e.preventDefault(); }
  });

  document.addEventListener("click", (e) => {
    if (e.target.closest("#timepop") || e.target.closest(".pin-widget")) return; // 별도 핸들러 처리
    const t = e.target.closest("[data-cat],[data-todo-filter],[data-toggle],[data-ev-toggle],[data-edit-event],[data-del-event],[data-edit-todo],[data-del-todo],[data-ww],[data-dash-toggle],#dash-collapse,#wk-prev,#wk-next,#wk-today,#roll-desktop,#roll-mobile,#set-theme,#set-pin,#set-export,#set-import,#set-clear,#set-alert-demo,#set-close,[data-paper],[data-theme-key],[data-contrast],[data-step],[data-proj],#pj-new,[data-band-more]");
    if (!t) return;
    if (t.dataset.evToggle) { Store.toggleEvent(t.dataset.evToggle); return; }
    if (t.dataset.dashToggle) { ui.dashExp[t.dataset.dashToggle] = !ui.dashExp[t.dataset.dashToggle]; saveUI(); render(); return; }
    if (t.id === "dash-collapse") { ui.dashCollapsed = true; saveUI(); render(); return; }
    if (t.id === "set-close") { setView(ui.prevView && ui.prevView !== "settings" ? ui.prevView : "today"); return; }
    if (t.id === "set-alert-demo") { showAlertCard({ title: "○○업체 방문 (예시 알림)", time: "14:00", endTime: "16:00", location: "세종 공장", allDay: false }, "demo-" + Date.now()); toast("알림 팝업 예시를 띄웠습니다"); return; }
    if (t.dataset.cat != null) { ui.cat = t.dataset.cat; render(); return; }
    if (t.dataset.todoFilter != null) { ui.todoFilter = t.dataset.todoFilter; render(); return; }
    if (t.dataset.ww != null) { ui.workweek = t.dataset.ww === "1"; saveUI(); render(); return; }
    if (t.dataset.toggle) { Store.toggleTodo(t.dataset.toggle); return; }
    if (t.dataset.editEvent) { const ev = Store.state.events.find((x) => x.id === t.dataset.editEvent); if (ev) openModal("event", ev); return; }
    if (t.dataset.delEvent) { Store.deleteEvent(t.dataset.delEvent); toast("일정을 삭제했습니다"); return; }
    if (t.dataset.editTodo) { const td = Store.state.todos.find((x) => x.id === t.dataset.editTodo); if (td) openModal("todo", td); return; }
    if (t.dataset.delTodo) { Store.deleteTodo(t.dataset.delTodo); toast("할 일을 삭제했습니다"); return; }
    if (t.id === "wk-prev") { ui.weekRef = addDays(ui.weekRef, ui.workweek ? -7 : -7); render(); return; }
    if (t.id === "wk-next") { ui.weekRef = addDays(ui.weekRef, 7); render(); return; }
    if (t.id === "wk-today") { ui.weekRef = startOfWeek(new Date()); render(); return; }
    if (t.id === "roll-desktop" || t.id === "roll-mobile") { const n = Store.rollover(); toast(n ? `${n}건을 오늘로 이월했습니다` : "이월할 업무가 없습니다"); return; }
    if (t.dataset.themeKey) { setPref("theme", t.dataset.themeKey); render(); return; }
    if (t.dataset.contrast) { setPref("contrast", t.dataset.contrast); render(); return; }
    if (t.dataset.bandMore) { ui.bandOpen[t.dataset.bandMore] = !ui.bandOpen[t.dataset.bandMore]; render(); return; }
    if (t.id === "pj-new") { openModal("project", { cat: ui.cat === "personal" ? "personal" : "work" }); return; }
    if (t.dataset.proj) { openProject(t.dataset.proj); return; }
    if (t.dataset.step) {
      const inp = document.getElementById(t.dataset.step);
      if (inp) {
        const step = parseFloat(inp.step) || 1;
        const dir = parseInt(t.dataset.dir, 10) || 1;
        let v = (parseFloat(inp.value) || 0) + dir * step;
        v = Math.max(parseFloat(inp.min), Math.min(parseFloat(inp.max), v));
        inp.value = v;
        inp.dispatchEvent(new Event("input", { bubbles: true }));
      }
      return;
    }
    if (t.dataset.paper) { setPref("paperStyle", t.dataset.paper); render(); return; }
    if (t.id === "set-theme") { setTheme(!currentDark()); render(); return; }
    if (t.id === "set-pin") { togglePin(); render(); return; }
    if (t.id === "set-export") { exportData(); return; }
    if (t.id === "set-import") { importData(); return; }
    if (t.id === "set-clear") { if (confirm("이 기기의 모든 일정·할 일을 삭제할까요? 되돌릴 수 없습니다.")) { Store.replaceAll({ events: [], todos: [] }); toast("모든 데이터를 삭제했습니다"); } return; }
  });

  // 요약 패널 다시 열기
  document.getElementById("dash-reopen").addEventListener("click", () => { ui.dashCollapsed = false; saveUI(); render(); });

  // 캘린더/요약 2분할 리사이즈 (우측 바 드래그)
  const gutter = document.getElementById("gutter"); const app = document.getElementById("app");
  let rz = null;
  gutter.addEventListener("pointerdown", (e) => { rz = true; gutter.classList.add("dragging"); gutter.setPointerCapture(e.pointerId); e.preventDefault(); });
  gutter.addEventListener("pointermove", (e) => {
    if (!rz) return;
    const right = app.getBoundingClientRect().right;
    let w = right - e.clientX;
    w = Math.max(180, Math.min(560, w));
    ui.splitW = Math.round(w);
    document.documentElement.style.setProperty("--dash-w", ui.splitW + "px");
  });
  gutter.addEventListener("pointerup", () => { if (rz) { rz = false; gutter.classList.remove("dragging"); saveUI(); } });

  // 캘린더 빈 셀 클릭 → 추가
  document.getElementById("content").addEventListener("click", (e) => {
    const cell = e.target.closest(".cell, .band-cell");
    if (cell && !e.target.closest(".evt, .cal-chip, .band-more")) {
      const band = cell.dataset.band === "1";
      let time = band ? "" : cell.dataset.hour;
      if (!band) { const r = cell.getBoundingClientRect(); if (e.clientY - r.top > r.height / 2) time = time.slice(0, 3) + "30"; } // 아래 절반 = :30
      openModal("event", { date: cell.dataset.date, time, allDay: band, cat: ui.cat === "personal" ? "personal" : "work" });
    }
  });
}

/* ---------- 초기화 ---------- */
(function init() {
  try { const th = localStorage.getItem("scheduler:theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  updateThemeIcon();
  loadUI(); loadPin(); loadFS(); applyFontSize(fontSize);
  loadPrefs(); applyPrefs();                           // 위젯 설정(테마/투명도/대비/세부 글자/알림)
  Store.subscribe(render); Store.load();
  Store.purgeOld();                                   // 완료 후 1주일 지난 항목 자동 삭제
  Store.autoCarry();                                  // 어제까지 미완료 항목을 오늘로 이월(D+N)
  setInterval(() => Store.purgeOld(), 60 * 60 * 1000); // 1시간마다 정리
  wireGlobal(); wirePin();
  render();

  // 날짜(자정) 변경 감지 → 캘린더를 오늘 주간으로 이동 + 이월/정리/재렌더
  let _curDay = todayStr();
  function dayTick() {
    const d = todayStr();
    if (d !== _curDay) {
      _curDay = d;
      ui.weekRef = startOfWeek(new Date());
      Store.autoCarry();
      Store.purgeOld();
      render();
    }
  }
  setInterval(dayTick, 30 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) dayTick(); });
  window.addEventListener("focus", dayTick);

  // 알림 권한: 첫 상호작용 때 요청 (윈도우 팝업 알림용)
  document.addEventListener("click", () => requestNotify(), { once: true });
  // 서비스워커 알림의 30분/1시간 스누즈 → 지정 시간 뒤 다시 윈도우 팝업
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", (ev) => {
      if (ev.data && ev.data.type === "snooze") {
        const { minutes, data } = ev.data;
        setTimeout(() => osNotify(data.title, data.body, (data.key || "") + ":s"), minutes * 60000);
        toast(`${minutes}분 뒤 다시 알림`);
      }
    });
  }

  // PWA: 서비스 워커 등록 + 새 버전 자동 갱신
  if ("serviceWorker" in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!hadController || reloading) return; // 최초 설치 때는 새로고침 안 함
      reloading = true; location.reload();     // 새 버전 활성화되면 한 번 자동 새로고침
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
        reg.update();                                   // 방문 시 새 버전 확인
        setInterval(() => reg.update(), 60 * 60 * 1000); // 1시간마다 확인
      }).catch(() => {});
    });
  }
})();
</script>
</body>
</html>
