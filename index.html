<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2F5D62" />
<title>스케줄러</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="스케줄러" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F6F3; --surface:#FFFFFF; --surface-2:#EFEFEA; --surface-3:#E7E7E1;
    --border:#E1E1DA; --border-strong:#CFCFC6;
    --text:#1B1D1F; --text-soft:#6B6F76; --text-faint:#9CA0A6;
    --work:#2F5D62; --work-soft:#E5EEED; --work-line:#CFE0DE;
    --personal:#7C6FB0; --personal-soft:#EEEBF7; --personal-line:#DAD3EF;
    --urgent:#C0392B; --urgent-soft:#FBE9E7;
    --high:#B8792A; --high-soft:#FBF1E3;
    --done:#5E9A6E; --done-soft:#E9F3EB;
    --shadow: 0 1px 2px rgba(20,20,15,0.04), 0 4px 14px rgba(20,20,15,0.05);
    --shadow-lg: 0 10px 40px rgba(20,20,15,0.18);
    --radius: 10px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    /* 우선순위 음영 (soft보다 20% 더 짙게) */
    --pri-urgent: color-mix(in srgb, var(--urgent-soft), var(--urgent) 20%);
    --pri-high: color-mix(in srgb, var(--high-soft), var(--high) 20%);
    --pri-normal: color-mix(in srgb, var(--done-soft), var(--done) 20%);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15171A; --surface:#1C1F22; --surface-2:#23262A; --surface-3:#2B2F34;
      --border:#33373C; --border-strong:#3F444A;
      --text:#EBECEE; --text-soft:#A5AAB1; --text-faint:#787D84;
      --work:#7AC0C4; --work-soft:#1D2C2C; --work-line:#2B4142;
      --personal:#B3A6E3; --personal-soft:#282440; --personal-line:#3A345C;
      --urgent:#E28B7F; --urgent-soft:#3A2320;
      --high:#E0AD6E; --high-soft:#382C1B;
      --done:#8FCB9E; --done-soft:#20301F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#15171A; --surface:#1C1F22; --surface-2:#23262A; --surface-3:#2B2F34;
    --border:#33373C; --border-strong:#3F444A;
    --text:#EBECEE; --text-soft:#A5AAB1; --text-faint:#787D84;
    --work:#7AC0C4; --work-soft:#1D2C2C; --work-line:#2B4142;
    --personal:#B3A6E3; --personal-soft:#282440; --personal-line:#3A345C;
    --urgent:#E28B7F; --urgent-soft:#3A2320;
    --high:#E0AD6E; --high-soft:#382C1B;
    --done:#8FCB9E; --done-soft:#20301F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Noto Sans KR", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100%;
  }
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  svg{flex:none;}
  ::selection{background:var(--work-soft);}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:12px; padding:11px 16px;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;flex:none;}
  .logo .mark{width:26px;height:26px;border-radius:7px;background:var(--work);display:flex;align-items:center;justify-content:center;}
  .logo .mark svg{width:15px;height:15px;stroke:#fff;}
  .today-date{font-size:12.5px;color:var(--text-soft);font-weight:500;flex:none;}
  .search{
    flex:1; display:flex; align-items:center; gap:8px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:8px; padding:0 12px; max-width:360px; min-width:0;
  }
  .search svg{width:14px;height:14px;stroke:var(--text-faint);}
  .search input{flex:1;min-width:0;border:none;background:transparent;color:var(--text);font-size:13px;padding:8px 0;outline:none;}
  .search input::placeholder{color:var(--text-faint);}
  .topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none;}
  .icon-btn{
    width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-soft);
  }
  .icon-btn.on{background:var(--work-soft);color:var(--work);border-color:var(--work-line);}
  .icon-btn svg{width:16px;height:16px;stroke:currentColor;}
  .btn-primary{
    background:var(--work); color:#fff; border:none; border-radius:8px;
    padding:9px 15px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px;flex:none;
  }
  .btn-primary svg{width:14px;height:14px;stroke:#fff;}

  /* ---------- filter chips ---------- */
  .chip-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .chip{
    border:1px solid var(--border); background:var(--surface); color:var(--text-soft);
    border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .chip .dot{width:6px;height:6px;border-radius:50%;}
  .chip.active{border-color:transparent;}
  .chip[data-cat="all"].active{background:var(--text);color:var(--bg);}
  .chip[data-cat="work"].active{background:var(--work-soft);color:var(--work);border-color:var(--work-line);}
  .chip[data-cat="personal"].active{background:var(--personal-soft);color:var(--personal);border-color:var(--personal-line);}
  .cat-dot.work{background:var(--work);} .cat-dot.personal{background:var(--personal);}

  /* ---------- Top tab bar ---------- */
  .tabbar{position:sticky;top:55px;z-index:39;display:flex;align-items:center;gap:10px;padding:7px 16px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;}
  .tabs{display:flex;gap:4px;flex:none;}
  .tab{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-soft);border:none;background:transparent;white-space:nowrap;}
  .tab svg{width:16px;height:16px;stroke:currentColor;}
  .tab .count{font-size:11px;color:var(--text-faint);font-weight:700;}
  .tab.active{background:var(--work-soft);color:var(--work);}
  .tab.active .count{color:var(--work);}
  .tab-sep{width:1px;height:20px;background:var(--border);flex:none;}
  .tabbar .chip-row{flex:none;}
  .tabbar-cal{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none;}
  .tabbar-cal:empty{display:none;}
  .cal-range{font-size:11.5px;color:var(--text-faint);font-weight:700;white-space:nowrap;}

  /* ---------- App shell (resizable split) ---------- */
  .app{display:flex; flex:1 1 auto; min-height:0;}
  .content{padding:18px 22px;min-width:0;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:auto;}
  .gutter{flex:0 0 10px;cursor:col-resize;position:relative;display:none;touch-action:none;}
  .gutter::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border);transform:translateX(-50%);}
  .gutter::after{content:"⋮";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--text-faint);font-size:14px;line-height:1;}
  .gutter:hover::before,.gutter.dragging::before{width:3px;background:var(--work);}
  .dash{flex:0 0 var(--dash-w,300px);border-left:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:14px;overflow:auto;}
  .app.has-dash:not(.dash-collapsed) .gutter{display:block;}
  .app:not(.has-dash) .dash, .app.dash-collapsed .dash{display:none;}
  #dash-reopen{display:none;position:fixed;right:0;top:120px;z-index:38;border:1px solid var(--border);border-right:none;background:var(--surface);color:var(--text-soft);border-radius:8px 0 0 8px;padding:8px 6px;box-shadow:var(--shadow);writing-mode:vertical-rl;font-size:11px;font-weight:700;}
  .app.has-dash.dash-collapsed ~ #dash-reopen{display:block;}
  .dash-head{display:flex;align-items:center;justify-content:space-between;}
  .dash-title{font-size:12px;font-weight:800;color:var(--text-soft);}
  .dash-x{border:1px solid var(--border);background:var(--surface);color:var(--text-soft);border-radius:7px;width:26px;height:24px;font-size:13px;}
  /* compact one-line summary */
  .sumline{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:9px;padding:9px 11px;cursor:pointer;}
  .sumline .lbl{font-size:11px;font-weight:800;color:var(--text-faint);}
  .sumline .val{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right;}
  .sumline .val .warn{color:var(--urgent);font-weight:800;}
  .sumline .chev{color:var(--text-faint);font-size:11px;flex:none;}

  .view-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .view-head h2{font-size:17px;margin:0;font-weight:800;}
  .view-head .sub{font-size:12.5px;color:var(--text-faint);}
  .cal-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  /* segmented */
  .seg{display:inline-flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:9px;}
  .seg button{border:none;background:transparent;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-soft);white-space:nowrap;}
  .seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  /* ---------- week grid (calendar) ---------- */
  .week-nav{display:flex;align-items:center;gap:6px;}
  .week-nav button{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;}
  .week-nav button svg{width:13px;height:13px;stroke:var(--text-soft);}
  .week-nav .today-btn{width:auto;padding:0 10px;font-size:12px;font-weight:700;color:var(--text-soft);}
  .week-scroll{overflow:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;border:1px solid var(--border);border-radius:10px;}
  .week-grid{display:grid;background:var(--surface);}
  /* 요일/날짜 헤더 행 고정 (세로 스크롤 시 상단 유지) */
  .week-grid .corner{background:var(--surface-2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:6;}
  .week-grid .head{
    background:var(--surface-2);border-bottom:1px solid var(--border);border-left:1px solid var(--border);
    text-align:center;padding:8px 2px;font-size:11.5px;font-weight:700;color:var(--text-soft);
    position:sticky;top:0;z-index:5;
  }
  .week-grid .head .dow{font-size:10.5px;color:var(--text-faint);display:block;}
  .week-grid .head.today{color:var(--work);}
  .week-grid .head.today .num{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;background:var(--work);color:#fff;}
  /* all-day / todo band */
  .week-grid .band-label{background:var(--surface-2);border-bottom:1px solid var(--border);font-size:10px;color:var(--text-faint);font-weight:700;display:flex;align-items:center;justify-content:center;padding:4px 2px;}
  .week-grid .band-cell{border-bottom:1px solid var(--border);border-left:1px solid var(--border);min-height:32px;padding:3px;display:flex;flex-direction:column;gap:3px;}
  .week-grid .band-cell.today-col{background:color-mix(in srgb, var(--work) 14%, var(--surface));}
  .week-grid .hourlabel{font-size:10.5px;color:var(--text-faint);text-align:right;padding:4px 6px 0 0;border-top:1px solid var(--border);height:46px;}
  .week-grid .cell{border-top:1px solid var(--border);border-left:1px solid var(--border);height:46px;padding:0;position:relative;cursor:pointer;transition:background .1s;}
  .week-grid .cell:hover{background:var(--surface-2);}
  .week-grid .cell.has-evt{z-index:2;}
  .evt.timed{position:absolute;margin:0;padding:2px 5px;overflow:hidden;box-shadow:var(--shadow);}
  .week-grid .cell.today-col{background:color-mix(in srgb, var(--work) 10%, var(--surface));}
  .week-grid .head.today{background:color-mix(in srgb, var(--work) 16%, var(--surface));}
  .week-grid .drop-hover{background:var(--work-soft) !important;outline:2px dashed var(--work);outline-offset:-2px;}
  .evt{
    border-radius:6px;padding:3px 6px;font-size:11px;font-weight:600;margin-bottom:2px;line-height:1.3;
    cursor:pointer;overflow:hidden;text-align:left;
  }
  .week-grid .cell{text-align:left;}
  .evt .t{font-size:9.5px;opacity:.75;margin-right:4px;}
  .evt .ci{margin-right:1px;}
  .evt-d{font-size:9px;font-weight:800;color:#fff;background:var(--urgent);padding:0 3px;border-radius:3px;margin-right:2px;}
  /* 배경 = 우선순위(긴급 빨강/높음 주황/보통 초록), 좌측 선 = 분류 */
  .evt.pri-urgent{background:var(--pri-urgent);}
  .evt.pri-high{background:var(--pri-high);}
  .evt.pri-normal{background:var(--pri-normal);}
  .evt.work{border-left:3px solid var(--work);}
  .evt.personal{border-left:3px solid var(--personal);}
  .evt.done{opacity:.5;text-decoration:line-through;}
  .cal-chip{
    border-radius:5px;padding:2px 6px;font-size:10.5px;font-weight:600;line-height:1.25;cursor:pointer;
    display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .cal-chip svg{width:10px;height:10px;flex:none;}
  .cal-chip.allday{color:var(--text);}
  .cal-chip.allday.pri-urgent{background:var(--pri-urgent);}
  .cal-chip.allday.pri-high{background:var(--pri-high);}
  .cal-chip.allday.pri-normal{background:var(--pri-normal);}
  .cal-chip.allday.work{border-left:3px solid var(--work);}
  .cal-chip.allday.personal{border-left:3px solid var(--personal);}
  .cal-chip.todo{background:var(--high-soft);color:var(--high);}
  .cal-chip.todo.done{opacity:.5;text-decoration:line-through;}
  .cal-check{width:13px;height:13px;flex:none;border-radius:3px;border:1.5px solid var(--border-strong);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;vertical-align:middle;}
  .cal-check.done{background:var(--done);border-color:var(--done);}
  .cal-check svg{width:9px;height:9px;stroke:#fff;}
  .evt .cal-check{margin-right:3px;}
  .cal-chip.dragging,.evt.dragging{opacity:.4;}

  /* ---------- lists / cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .panel-title{font-size:12px;font-weight:700;color:var(--text-faint);margin:0 0 8px;letter-spacing:.02em;}

  .agenda{display:flex;flex-direction:column;gap:8px;}
  .row-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;border-left-width:4px;}
  .row-item.work{border-left-color:var(--work);} .row-item.personal{border-left-color:var(--personal);}
  .row-item.pri-urgent{background:var(--pri-urgent);} .row-item.pri-high{background:var(--pri-high);} .row-item.pri-normal{background:var(--pri-normal);}
  .row-item .box{width:19px;height:19px;flex:none;border-radius:6px;border:1.8px solid var(--border-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--surface);}
  .row-item .box.done{background:var(--done);border-color:var(--done);}
  .row-item .box svg{width:12px;height:12px;stroke:#fff;}
  .row-item.done .title{text-decoration:line-through;color:var(--text-faint);}
  .row-item .time{font-size:12px;font-weight:700;color:var(--text-soft);width:82px;flex:none;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .dbadge{font-size:9.5px;font-weight:800;color:#fff;background:var(--urgent);padding:1px 5px;border-radius:5px;}
  .row-item .body{flex:1;min-width:0;}
  .row-item .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;}
  .row-item .place{font-size:11.5px;color:var(--text-faint);}
  .row-item .actions{display:flex;gap:4px;opacity:.55;}
  .row-item .actions button{border:none;background:transparent;padding:4px;border-radius:6px;color:var(--text-soft);}
  .row-item .actions button svg{width:15px;height:15px;stroke:currentColor;}
  .row-item .actions button:hover{background:var(--surface-2);opacity:1;}

  .todo{display:flex;align-items:flex-start;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;}
  .todo .box{width:19px;height:19px;flex:none;border-radius:6px;border:1.8px solid var(--border-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;}
  .todo .box.done{background:var(--done);border-color:var(--done);}
  .todo .box svg{width:12px;height:12px;stroke:#fff;}
  .todo .tx{flex:1;min-width:0;cursor:pointer;}
  .todo .title{font-weight:600;}
  .todo.done .title{text-decoration:line-through;color:var(--text-faint);}
  .todo .meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .tag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;}
  .tag.urgent{background:var(--urgent);color:#fff;}
  .tag.high{background:var(--high);color:#fff;}
  .tag.normal{background:var(--done);color:#fff;}
  .tag.overdue{background:var(--urgent-soft);color:var(--urgent);}
  .todo .actions{display:flex;gap:2px;}
  .todo .actions button{border:none;background:transparent;padding:4px;border-radius:6px;color:var(--text-faint);}
  .todo .actions button svg{width:15px;height:15px;stroke:currentColor;}
  .todo .actions button:hover{background:var(--surface-2);color:var(--text-soft);}
  .badge-roll{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--high);background:var(--high-soft);padding:1px 6px;border-radius:5px;}
  .badge-roll svg{width:10px;height:10px;stroke:var(--high);}

  /* KPI */
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .kpi{background:var(--surface-2);border-radius:9px;padding:11px 10px;text-align:center;}
  .kpi .n{font-size:22px;font-weight:800;line-height:1;}
  .kpi .l{font-size:10.5px;color:var(--text-faint);margin-top:5px;}
  .kpi.warn .n{color:var(--urgent);}

  .btn-roll{
    width:100%;margin-top:8px;border:1px solid var(--high);background:var(--high-soft);color:var(--high);
    border-radius:8px;padding:8px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn-roll svg{width:13px;height:13px;stroke:var(--high);}
  .roll-row{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--border);}
  .roll-row:last-of-type{border-bottom:none;}
  .roll-row .from{font-size:10.5px;font-weight:800;color:var(--urgent);background:var(--urgent-soft);padding:1px 6px;border-radius:5px;flex:none;}

  .empty{text-align:center;color:var(--text-faint);font-size:12.5px;padding:26px 0;}
  .empty svg{width:16px;height:16px;stroke:var(--done);vertical-align:-3px;margin-right:5px;}

  /* settings */
  .set-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;border-bottom:1px solid var(--border);}
  .set-row:last-child{border-bottom:none;}
  .set-row .lab{font-weight:600;}
  .set-row .desc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .switch{width:44px;height:26px;border-radius:999px;background:var(--surface-3);position:relative;border:none;flex:none;transition:background .15s;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s;}
  .switch.on{background:var(--work);}
  .switch.on::after{left:21px;}
  .btn-sub{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;}
  .btn-danger{border:1px solid var(--urgent);color:var(--urgent);background:transparent;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;}

  /* ---------- mobile bottom nav ---------- */
  .bottom-nav{display:none;}

  /* ---------- 알림 팝업 스택 (우측) ---------- */
  #alert-stack{position:fixed;top:64px;right:16px;z-index:150;display:flex;flex-direction:column;gap:10px;width:300px;max-width:calc(100vw - 24px);}
  .alert-card{background:var(--surface);border:1px solid var(--border-strong);border-left:4px solid var(--urgent);border-radius:12px;box-shadow:var(--shadow-lg);padding:12px 14px;animation:ac-in .2s ease;}
  @keyframes ac-in{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}
  .alert-card .ac-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .alert-card .ac-badge{font-size:10px;font-weight:800;color:var(--urgent);background:var(--urgent-soft);padding:2px 8px;border-radius:6px;display:flex;align-items:center;gap:4px;}
  .alert-card .ac-badge svg{width:11px;height:11px;stroke:var(--urgent);}
  .alert-card .ac-time{font-size:11.5px;font-weight:700;color:var(--text-soft);}
  .alert-card .ac-title{font-weight:700;font-size:14px;}
  .alert-card .ac-loc{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .alert-card .ac-actions{display:flex;gap:6px;margin-top:10px;}
  .alert-card .ac-actions button{flex:1;border:1px solid var(--border);background:var(--surface-2);color:var(--text-soft);border-radius:7px;padding:8px 4px;font-size:11.5px;font-weight:700;}
  .alert-card .ac-actions .ac-ok{background:var(--work);color:#fff;border-color:var(--work);}

  /* ---------- modal (CENTER) ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,15,12,.45);z-index:100;
    display:none;align-items:center;justify-content:center;padding:16px;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    width:100%;max-width:480px;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto;
    padding:18px 18px calc(18px + var(--safe-b));
  }
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:800;}
  .modal .type-tabs{display:flex;gap:6px;margin-bottom:14px;}
  .modal .type-tabs button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:9px;font-size:13px;font-weight:700;color:var(--text-soft);}
  .modal .type-tabs button.active{background:var(--work-soft);color:var(--work);border-color:var(--work-line);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--text-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    border-radius:8px;padding:10px 12px;font-size:14px;outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--work);background:var(--surface);}
  .field textarea{resize:vertical;min-height:56px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .inline-check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-soft);cursor:pointer;user-select:none;}
  .inline-check input{width:auto;}
  .seg-cat{display:flex;gap:8px;}
  .seg-cat button{flex:1;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:9px;font-size:13px;font-weight:600;color:var(--text-soft);display:flex;align-items:center;justify-content:center;gap:6px;}
  .seg-cat button .dot{width:8px;height:8px;border-radius:50%;}
  .seg-cat button.active[data-v="work"]{background:var(--work-soft);color:var(--work);border-color:var(--work-line);}
  .seg-cat button.active[data-v="personal"]{background:var(--personal-soft);color:var(--personal);border-color:var(--personal-line);}
  .modal-actions{display:flex;gap:8px;margin-top:6px;align-items:center;}
  .modal-actions .btn-primary{flex:1;justify-content:center;padding:12px;}
  .modal-actions .btn-sub{padding:12px 18px;}
  .modal-actions .btn-del{margin-right:auto;border:none;background:transparent;color:var(--urgent);font-weight:700;font-size:12.5px;}

  /* ---------- pin widget (float on top, in-app) ---------- */
  .pin-widget{
    position:fixed;z-index:80;width:260px;max-width:calc(100vw - 24px);
    background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;
    box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;max-height:60vh;
  }
  .pin-widget[hidden]{display:none;}
  .pin-head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--work);color:#fff;cursor:move;user-select:none;}
  .pin-head .pin-title{font-size:12.5px;font-weight:800;flex:1;display:flex;align-items:center;gap:5px;}
  .pin-head .pin-title svg{width:13px;height:13px;stroke:#fff;}
  .pin-head button{border:none;background:rgba(255,255,255,.18);color:#fff;width:22px;height:22px;border-radius:6px;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .pin-opacity{display:none;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);font-size:10.5px;color:var(--text-faint);}
  .pin-opacity input{flex:1;}
  .pin-widget.show-op:not(.collapsed) .pin-opacity{display:flex;}
  .pin-qa{display:none;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--border);}
  .pin-widget.show-qa:not(.collapsed) .pin-qa{display:flex;}
  .pin-qa select{border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:6px;font-size:11px;padding:5px 4px;flex:none;}
  .pin-qa input{flex:1;min-width:0;border:1px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:6px;font-size:12px;padding:6px 8px;outline:none;}
  .pin-qa input:focus{border-color:var(--work);background:var(--surface);}
  .pin-qa button{border:none;background:var(--work);color:#fff;border-radius:6px;font-size:11.5px;font-weight:700;padding:6px 10px;flex:none;}
  .pin-head button.on{background:rgba(255,255,255,.4);}
  .pin-body{padding:8px 10px;overflow:auto;}
  .pin-todo{display:flex;align-items:flex-start;gap:8px;padding:6px;border-radius:7px;margin-bottom:4px;}
  .pin-todo.pri-urgent{background:var(--pri-urgent);}
  .pin-todo.pri-high{background:var(--pri-high);}
  .pin-todo.pri-normal{background:var(--pri-normal);}
  .pin-todo .box{width:16px;height:16px;flex:none;border-radius:5px;border:1.6px solid var(--border-strong);display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:1px;background:var(--surface);}
  .pin-todo .box.done{background:var(--done);border-color:var(--done);}
  .pin-todo .box svg{width:10px;height:10px;stroke:#fff;}
  .pin-tx{flex:1;min-width:0;cursor:pointer;}
  .pin-todo .t{font-size:12.5px;font-weight:600;}
  .pin-todo.done .t{text-decoration:line-through;color:var(--text-faint);}
  .pin-todo.done{opacity:.7;}
  .pin-todo .m{font-size:10.5px;color:var(--text-faint);}
  .pin-widget.collapsed .pin-opacity,.pin-widget.collapsed .pin-body{display:none;}
  .pin-empty{font-size:11px;color:var(--text-faint);text-align:center;padding:8px 0;}
  .pin-sec{font-size:10px;font-weight:800;color:var(--text-faint);margin:2px 0 4px;}
  .pin-divider{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--work);margin:10px 0 5px;}
  .pin-divider::before,.pin-divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .pin-todo .dd{font-size:9px;font-weight:800;color:#fff;background:var(--urgent);padding:0 4px;border-radius:4px;margin-right:4px;}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:600;
    display:flex;align-items:center;gap:8px;z-index:200;opacity:0;pointer-events:none;transition:.25s;box-shadow:var(--shadow-lg);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast svg{width:15px;height:15px;stroke:var(--done);}

  /* ============ RESPONSIVE ============ */
  @media (max-width: 900px){
    .dash, .gutter{display:none !important;}
    #dash-reopen{display:none !important;}
    .tabbar .tabs, .tabbar .tab-sep{display:none;}
    .tabbar{top:55px;}
    .content{padding:16px 16px calc(78px + var(--safe-b));}
    .search{max-width:none;}
    .today-date{display:none;}
    .topbar .btn-primary span{display:none;}
    .topbar .btn-primary{padding:9px 11px;}
    .bottom-nav{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;
      background:var(--surface);border-top:1px solid var(--border);
      padding:8px 6px calc(8px + var(--safe-b));justify-content:space-around;
    }
    .bottom-nav button{
      border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;
      font-size:10.5px;font-weight:600;color:var(--text-faint);flex:1;padding:2px;
    }
    .bottom-nav button svg{width:21px;height:21px;stroke:currentColor;}
    .bottom-nav button.active{color:var(--work);}
    .week-grid{min-width:560px;}
    #alert-stack{top:auto;bottom:calc(74px + var(--safe-b));right:12px;left:12px;width:auto;}
  }
  @media (min-width: 901px){ .mobile-only{display:none !important;} }

  /* 데스크탑: 추가/수정 모달을 약 절반 크기·폰트로 컴팩트하게 */
  @media (min-width: 901px){
    .modal.compact{max-width:320px;padding:14px 14px 16px;}
    .modal.compact h3{font-size:13px;margin-bottom:10px;}
    .modal.compact .field{margin-bottom:8px;}
    .modal.compact .field label{font-size:10px;margin-bottom:3px;}
    .modal.compact .field input,.modal.compact .field select,.modal.compact .field textarea{font-size:11.5px;padding:6px 8px;border-radius:6px;}
    .modal.compact .field textarea{min-height:44px;}
    .modal.compact .type-tabs button{padding:6px;font-size:11.5px;}
    .modal.compact .seg-cat button{padding:6px;font-size:11.5px;}
    .modal.compact .inline-check{font-size:11.5px;}
    .modal.compact .modal-actions .btn-primary,.modal.compact .modal-actions .btn-sub{padding:9px;font-size:12px;}
  }
  /* 시간 선택기 (시계형: 시 → 분) */
  .tp-wrap{position:relative;}
  .tp-input{cursor:pointer;}
  .tp-ic{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-faint);pointer-events:none;}
  .timepop{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px;width:224px;}
  .timepop[hidden]{display:none;}
  .tp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .tp-cur{font-size:15px;font-weight:800;}
  .tp-steps{display:inline-flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:8px;}
  .tp-steps button{border:none;background:transparent;padding:4px 9px;border-radius:6px;font-size:11.5px;font-weight:700;color:var(--text-soft);}
  .tp-steps button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
  /* 아날로그 시계 선택 */
  .tp-clock{position:relative;width:204px;height:204px;margin:6px auto 2px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);}
  .tp-clock .tp-center{position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:var(--work);transform:translate(-50%,-50%);}
  .tp-clock button{position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);border:none;background:transparent;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;padding:0;}
  .tp-clock button.inner{font-size:10.5px;color:var(--text-faint);}
  .tp-clock button:hover{background:var(--surface-3);}
  .tp-clock button.sel{background:var(--work);color:#fff;}
  .tp-hint{text-align:center;font-size:10.5px;color:var(--text-faint);margin-top:2px;}
  /* 모달 안 [추가 옵션] 접기 */
  .more-btn{width:100%;border:1px dashed var(--border-strong);background:transparent;color:var(--text-soft);border-radius:8px;padding:8px;font-size:12px;font-weight:700;margin-bottom:10px;}
  #m-extra[hidden]{display:none;}
</style>
</head>
<body>

    </div>
    <span class="today-date" id="today-date"></span>
    <div class="search">

    </div>
    <div class="tab-sep"></div>
    <div class="chip-row" data-chips></div>
    <div class="tabbar-cal" id="tabbar-cal"></div>
  </div>

  <div class="app" id="app">
    <main class="content" id="content"></main>
    <div class="gutter" id="gutter"></div>
    <aside class="dash" id="dash"></aside>
  </div>
  <button id="dash-reopen">‹ 요약</button>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav">
    <button data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>오늘</button>
    <button data-view="calendar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>캘린더</button>
    <button data-view="todo"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>할 일</button>
    <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>설정</button>
  </nav>

  <!-- 알림 팝업 스택 -->
  <div id="alert-stack"></div>

  <!-- Pin widget -->
  <div class="pin-widget" id="pin-widget" hidden>
    <div class="pin-head" id="pin-head">
      <span class="pin-title"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6z"/><path d="M12 15v5"/></svg>오늘 할 일</span>
      <button id="pin-add" title="추가">+</button>
      <button id="pin-optoggle" title="투명도"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" style="width:13px;height:13px;stroke:#fff"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 000 18z" fill="#fff" stroke="none"/></svg></button>
      <button id="pin-collapse" title="접기/펼치기">–</button>
      <button id="pin-hide" title="닫기">×</button>

    <div class="pin-opacity">

      <input type="range" id="pin-opacity" min="35" max="100" value="100" />
      <span id="pin-opacity-val">100%</span>

      <select id="pin-qa-kind"><option value="todo">할 일</option><option value="event">일정</option></select>
      <input id="pin-qa-input" type="text" placeholder="제목 입력 후 Enter" autocomplete="off" />
      <button id="pin-qa-go">추가</button>

    <div class="pin-body" id="pin-body"></div>

  <!-- Modal -->
  <div class="modal-backdrop" id="modal-backdrop"><div class="modal" id="modal"></div></div>

  <div id="toast"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><span id="toast-text"></span></div>

<script>
"use strict";
/* =========================================================================
   스케줄러 — 반응형 단일 페이지 앱 (localStorage 저장)
   ========================================================================= */
const APP_VERSION = "2026-09-23 · 헤더 고정 수정(내부 스크롤)";

/* ---------- 유틸 ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYMD = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
function addMin(hhmm, mins) { if (!hhmm) return ""; const [h, m] = hhmm.split(":").map(Number); let t = h * 60 + m + mins; t = ((t % 1440) + 1440) % 1440; return pad(Math.floor(t / 60)) + ":" + pad(t % 60); }
const todayStr = () => ymd(new Date());
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
function startOfWeek(date) { const d = new Date(date); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); d.setHours(0,0,0,0); return d; }
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
function fmtKDate(s) { const d = parseYMD(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; }
function fmtDueMeta(s) {
  if (!s) return "";
  const diff = Math.round((parseYMD(s) - parseYMD(todayStr())) / 86400000);
  if (diff === 0) return "오늘 마감"; if (diff === 1) return "내일 마감";
  if (diff < 0) return `${-diff}일 지남`; return `${fmtKDate(s)} 마감`;
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
const PRIO = { urgent: { label: "긴급", rank: 0 }, high: { label: "높음", rank: 1 }, normal: { label: "보통", rank: 2 } };
const REPEAT_LABEL = { none: "반복 안 함", daily: "매일", weekly: "매주", monthly: "매월" };
const REMIND_LABEL = { none: "없음", "0": "정시", "5": "5분 전", "10": "10분 전", "30": "30분 전", "60": "1시간 전", "1440": "1일 전" };

/* ---------- Store (데이터 계층) ---------- */
const Store = (() => {
  const KEY = "scheduler:v1";
  let state = { version: 2, events: [], todos: [] };
  const subs = [];

  function normalizeEvent(e) {
    return {
      id: e.id || uid(), title: e.title || "", cat: e.cat === "personal" ? "personal" : "work",
      date: e.date || todayStr(),
      allDay: !!e.allDay,
      time: e.allDay ? "" : (e.time || ""),
      endTime: e.allDay ? "" : (e.endTime || ""),
      location: e.location != null ? e.location : (e.place || ""),
      note: e.note || "",
      reminder: e.reminder || "none",
      repeat: e.repeat || "none",
      priority: PRIO[e.priority] ? e.priority : "normal",
      done: !!e.done, doneAt: e.doneAt || null,
      rolledFrom: e.rolledFrom || null,
      createdAt: e.createdAt || Date.now(),
    };
  }
  function normalizeTodo(t) {
    return { id: t.id || uid(), title: t.title || "", cat: t.cat === "personal" ? "personal" : "work",
      priority: PRIO[t.priority] ? t.priority : "normal", due: t.due || null, note: t.note || "",
      done: !!t.done, doneAt: t.doneAt || null, rolledFrom: t.rolledFrom || null, createdAt: t.createdAt || Date.now() };
  }

  function seed() {
    const base = startOfWeek(new Date());
    const d = (n) => ymd(addDays(base, n));
    state.events = [
      normalizeEvent({ title: "생산회의", location: "2층 회의실", cat: "work", date: d(2), time: "09:00", endTime: "10:00", reminder: "10" }),
      normalizeEvent({ title: "업체 통화", location: "△△코스메틱", cat: "work", date: d(2), time: "11:00", endTime: "11:30" }),
      normalizeEvent({ title: "○○업체 방문", location: "세종 공장", cat: "work", date: d(2), time: "14:00", endTime: "16:00", note: "견적/CAPA 확인", reminder: "30" }),
      normalizeEvent({ title: "가족 저녁", cat: "personal", date: d(2), time: "19:00", endTime: "20:30" }),
      normalizeEvent({ title: "주간 업무보고", cat: "work", date: d(4), time: "10:00", endTime: "10:30", repeat: "weekly" }),
    ];
    state.todos = [
      normalizeTodo({ title: "○○업체 견적 확인", cat: "work", priority: "urgent", due: todayStr() }),
      normalizeTodo({ title: "신규업체 평가자료 작성", cat: "work", priority: "high", due: d(3) }),
      normalizeTodo({ title: "생산 CAPA 확인 요청", cat: "work", priority: "normal", due: d(2) }),
      normalizeTodo({ title: "품질 인증서 스캔본 정리", cat: "work", priority: "normal", due: todayStr() }),
      normalizeTodo({ title: "샘플 발송 확인", cat: "work", priority: "normal", due: ymd(addDays(base, 1)), done: true }),
      normalizeTodo({ title: "견적서 회신 (△△코스메틱)", cat: "work", priority: "high", due: ymd(addDays(new Date(), -2)) }),
    ];
  }
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.events) && Array.isArray(p.todos)) {
        state = { version: 2, events: p.events.map(normalizeEvent), todos: p.todos.map(normalizeTodo) }; return; } }
    } catch (e) {}
    seed(); persist();
  }
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function emit() { persist(); subs.forEach((f) => f(state)); }

  return {
    get state() { return state; },
    subscribe(fn) { subs.push(fn); }, load, normalizeEvent, normalizeTodo,
    addEvent(e) { state.events.push(normalizeEvent(e)); emit(); },
    updateEvent(id, patch) { const e = state.events.find((x) => x.id === id); if (e) Object.assign(e, normalizeEvent({ ...e, ...patch })); emit(); },
    deleteEvent(id) { state.events = state.events.filter((x) => x.id !== id); emit(); },
    addTodo(t) { state.todos.push(normalizeTodo(t)); emit(); },
    updateTodo(id, patch) { const t = state.todos.find((x) => x.id === id); if (t) Object.assign(t, normalizeTodo({ ...t, ...patch })); emit(); },
    toggleTodo(id) { const t = state.todos.find((x) => x.id === id); if (t) { t.done = !t.done; t.doneAt = t.done ? Date.now() : null; } emit(); },
    toggleEvent(id) { const e = state.events.find((x) => x.id === id); if (e) { e.done = !e.done; e.doneAt = e.done ? Date.now() : null; } emit(); },
    purgeOld() {
      const cut = Date.now() - 7 * 86400000; let n = 0;
      const kt = state.todos.filter((t) => !(t.done && t.doneAt && t.doneAt < cut)); n += state.todos.length - kt.length; state.todos = kt;
      const ke = state.events.filter((e) => !(e.done && e.doneAt && e.doneAt < cut)); n += state.events.length - ke.length; state.events = ke;
      if (n) emit(); return n;
    },
    // 어제까지 처리 못한 미완료 항목을 오늘로 이월(같은 시간 유지, 원래 날짜 rolledFrom 기록 → D+N)
    autoCarry() {
      const today = todayStr(); let n = 0;
      state.events.forEach((e) => {
        if (e.done || e.allDay) return;
        if (e.repeat && e.repeat !== "none") return; // 반복 일정 제외
        if (e.date < today) { e.rolledFrom = e.rolledFrom || e.date; e.date = today; n++; }
      });
      state.todos.forEach((t) => {
        if (t.done || !t.due) return;
        if (t.due < today) { t.rolledFrom = t.rolledFrom || t.due; t.due = today; n++; }
      });
      if (n) emit(); return n;
    },
    deleteTodo(id) { state.todos = state.todos.filter((x) => x.id !== id); emit(); },
    rollover() { const today = todayStr(); let n = 0; state.todos.forEach((t) => { if (!t.done && t.due && t.due < today) { t.rolledFrom = t.due; t.due = today; n++; } }); if (n) emit(); return n; },
    replaceAll(next) { if (next && Array.isArray(next.events) && Array.isArray(next.todos)) { state = { version: 2, events: next.events.map(normalizeEvent), todos: next.todos.map(normalizeTodo) }; emit(); return true; } return false; },
    exportJSON() { return JSON.stringify({ version: 2, events: state.events, todos: state.todos }, null, 2); },
  };
})();

/* ---------- UI 상태 (일부 저장) ---------- */
const ui = { view: "today", cat: "all", search: "", todoFilter: "active", weekRef: startOfWeek(new Date()), workweek: false,
  splitW: 300, dashCollapsed: false, dashExp: { summary: false, important: false } };
function loadUI() {
  try {
    const p = JSON.parse(localStorage.getItem("scheduler:ui") || "{}");
    if (typeof p.workweek === "boolean") ui.workweek = p.workweek;
    if (p.view) ui.view = p.view;
    if (typeof p.splitW === "number") ui.splitW = Math.max(180, Math.min(560, p.splitW));
    if (typeof p.dashCollapsed === "boolean") ui.dashCollapsed = p.dashCollapsed;
    if (p.dashExp) ui.dashExp = { summary: !!p.dashExp.summary, important: !!p.dashExp.important };
  } catch (e) {}
}
function saveUI() { try { localStorage.setItem("scheduler:ui", JSON.stringify({ workweek: ui.workweek, view: ui.view, splitW: ui.splitW, dashCollapsed: ui.dashCollapsed, dashExp: ui.dashExp })); } catch (e) {} }

/* ---------- 필터 & 반복 전개 ---------- */
function matchCat(x) { return ui.cat === "all" || x.cat === ui.cat; }
function matchSearch(text) { if (!ui.search) return true; return String(text || "").toLowerCase().includes(ui.search.toLowerCase()); }
function eventMatches(e) { return matchCat(e) && matchSearch(e.title + " " + e.location); }
function visibleTodos() { return Store.state.todos.filter((t) => matchCat(t) && matchSearch(t.title)); }

// 반복 일정 전개: 특정 날짜(ds)에 해당 이벤트가 발생하는가
function occursOn(e, ds) {
  if (e.repeat === "none" || !e.repeat) return e.date === ds;
  if (ds < e.date) return false;
  const base = parseYMD(e.date), tgt = parseYMD(ds);
  if (e.repeat === "daily") return true;
  if (e.repeat === "weekly") return ((tgt - base) / 86400000) % 7 === 0;
  if (e.repeat === "monthly") return base.getDate() === tgt.getDate();
  return false;
}
// 특정 날짜의 (필터 적용된) 이벤트 목록 — 반복 전개된 가상 인스턴스 반환
function eventsOn(ds) {
  return Store.state.events.filter((e) => eventMatches(e) && occursOn(e, ds))
    .map((e) => ({ ...e, date: ds, _base: e.id }))
    .sort((a, b) => (a.allDay ? "" : a.time || "").localeCompare(b.allDay ? "" : b.time || ""));
}

/* ---------- 아이콘 ---------- */
const IC = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>',
  roll: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M4 12a8 8 0 0114-5.3M20 12a8 8 0 01-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>',
};
function evTimeText(e) { if (e.allDay) return "종일"; if (!e.time) return ""; return e.endTime ? `${e.time}–${e.endTime}` : e.time; }
// 분류 이모지: 업무=회사, 개인=사람
function catIcon(cat) { return cat === "personal" ? "👤" : "🏢"; }
const daysBetween = (a, b) => Math.round((parseYMD(b) - parseYMD(a)) / 86400000);

// 오늘 일정 목록 = 오늘 발생 이벤트(이월된 항목 포함, D+N = 원래 날짜로부터 지연일)
function todayAgendaEvents() {
  const today = todayStr();
  return eventsOn(today).filter((e) => !e.done)
    .map((e) => ({ ...e, _delay: e.rolledFrom ? daysBetween(e.rolledFrom, today) : 0 }))
    .sort((a, b) => (a.time || "").localeCompare(b.time || ""));
}

/* ---------- 렌더: 오늘 ---------- */
function renderToday() {
  const today = todayStr();
  const evs = todayAgendaEvents();
  const dueToday = visibleTodos().filter((t) => !t.done && t.due === today);
  const overdue = visibleTodos().filter((t) => !t.done && t.due && t.due < today);
  let html = `<div class="view-head"><div><h2>오늘</h2><div class="sub">${fmtKDate(today)}</div></div></div>`;
  html += `<p class="panel-title">오늘 일정 · ${evs.length}건</p>`;
  html += evs.length ? `<div class="agenda">${evs.map(eventRow).join("")}</div>` : `<div class="empty">오늘 일정이 없습니다.</div>`;
  html += `<p class="panel-title" style="margin-top:22px">오늘 마감 할 일 · ${dueToday.length}건</p>`;
  html += dueToday.length ? `<div class="agenda">${dueToday.map(todoRow).join("")}</div>` : `<div class="empty">${IC.check}오늘 마감 할 일이 없습니다.</div>`;
  if (overdue.length) {
    html += `<p class="panel-title" style="margin-top:22px">지연된 할 일 · ${overdue.length}건</p>`;
    html += `<div class="agenda">${overdue.map(todoRow).join("")}</div>`;
    html += `<button class="btn-roll" id="roll-mobile">${IC.roll}지난 할 일 오늘로 이월</button>`;
  }
  return html;
}

// 캘린더 컨트롤(주간 전환 + 주 이동 + 날짜 범위) — 상단 탭바 우측에 표시
function calControlsHtml() {
  const nDays = ui.workweek ? 5 : 7;
  const week = [...Array(nDays)].map((_, i) => addDays(ui.weekRef, i));
  const from = week[0], to = week[nDays - 1];
  const range = `${from.getMonth() + 1}.${from.getDate()}–${to.getMonth() + 1}.${to.getDate()}`;
  return `<span class="cal-range">${range}</span>
    <div class="seg" id="wk-mode">
      <button class="${!ui.workweek ? "active" : ""}" data-ww="0">월~일</button>
      <button class="${ui.workweek ? "active" : ""}" data-ww="1">월~금</button>
    </div>
    <div class="week-nav">
      <button id="wk-prev">${IC.left}</button>
      <button class="today-btn" id="wk-today">오늘</button>
      <button id="wk-next">${IC.right}</button>
    </div>`;
}

/* ---------- 렌더: 캘린더 (주간 그리드) ---------- */
function renderCalendar() {
  const nDays = ui.workweek ? 5 : 7;
  const week = [...Array(nDays)].map((_, i) => addDays(ui.weekRef, i));
  const today = todayStr();
  const head = "";
  // 오늘 열은 다른 날보다 좌우 폭 1.5배
  const cols = `grid-template-columns:46px ` + week.map((d) => ymd(d) === today ? "minmax(96px,1.5fr)" : "minmax(60px,1fr)").join(" ") + ";";
  let grid = `<div class="week-scroll"><div class="week-grid" style="${cols}"><div class="corner"></div>`;
  week.forEach((d) => {
    const isToday = ymd(d) === today;
    grid += `<div class="head ${isToday ? "today" : ""}"><span class="dow">${DOW[d.getDay()]}</span><span class="num">${d.getDate()}</span></div>`;
  });
  // 종일/할일 밴드
  grid += `<div class="band-label">종일<br>·할일</div>`;
  week.forEach((d) => {
    const ds = ymd(d);
    const isToday = ds === today;
    const allday = eventsOn(ds).filter((e) => e.allDay);
    const todos = visibleTodos().filter((t) => t.due === ds);
    let cell = `<div class="band-cell ${isToday ? "today-col" : ""}" data-date="${ds}" data-band="1">`;
    cell += allday.map((e) => `<div class="cal-chip allday pri-${e.priority} ${e.cat} ${e.done ? "done" : ""}" draggable="true" data-drag="event" data-id="${e._base}" data-edit-event="${e._base}"><span class="cal-check ${e.done ? "done" : ""}" data-ev-toggle="${e._base}">${e.done ? IC.check : ""}</span><span class="ci">${catIcon(e.cat)}</span>${esc(e.title)}</div>`).join("");
    cell += todos.map((t) => `<div class="cal-chip todo ${t.done ? "done" : ""}" draggable="true" data-drag="todo" data-id="${t.id}" data-edit-todo="${t.id}"><span class="cal-check ${t.done ? "done" : ""}" data-toggle="${t.id}">${t.done ? IC.check : ""}</span>${esc(t.title)}</div>`).join("");
    cell += `</div>`;
    grid += cell;
  });
  // 시간 행 — 시간 범위(시작~종료)만큼 세로로 채워지는 블록으로 표시
  const CELL_H = 46;
  const toMin = (t) => { const [a, b] = (t || "0:0").split(":").map(Number); return a * 60 + (b || 0); };
  for (let h = 8; h <= 20; h++) {
    grid += `<div class="hourlabel">${h}:00</div>`;
    week.forEach((d) => {
      const ds = ymd(d);
      const isToday = ds === today;
      const starts = eventsOn(ds).filter((e) => !e.allDay && parseInt((e.time || "0").slice(0, 2), 10) === h);
      const n = Math.max(1, starts.length);
      const inner = starts.map((e, i) => {
        const sM = toMin(e.time), eM = e.endTime ? toMin(e.endTime) : sM + 30;
        const dur = Math.max(30, eM - sM);
        const top = ((sM - h * 60) / 60) * CELL_H;
        const height = (dur / 60) * CELL_H - 2;
        const w = 100 / n, left = i * w;
        return `<div class="evt timed pri-${e.priority} ${e.cat} ${e.done ? "done" : ""}" style="top:${top.toFixed(1)}px;left:calc(${left}% + 1px);width:calc(${w}% - 3px);height:${height.toFixed(1)}px;" draggable="true" data-drag="event" data-id="${e._base}" data-edit-event="${e._base}"><span class="cal-check ${e.done ? "done" : ""}" data-ev-toggle="${e._base}">${e.done ? IC.check : ""}</span><span class="t">${esc(evTimeText(e))}</span><span class="ci">${catIcon(e.cat)}</span>${e.rolledFrom ? `<span class="evt-d">D+${daysBetween(e.rolledFrom, e.date)}</span>` : ""}${esc(e.title)}${e.repeat !== "none" ? " ↻" : ""}</div>`;
      }).join("");
      grid += `<div class="cell ${starts.length ? "has-evt" : ""} ${isToday ? "today-col" : ""}" data-date="${ds}" data-hour="${pad(h)}:00">${inner}</div>`;
    });
  }
  grid += `</div></div>`;
  return head + grid;
}

/* ---------- 렌더: 할 일 ---------- */
function renderTodo() {
  let list = visibleTodos();
  if (ui.todoFilter === "active") list = list.filter((t) => !t.done);
  else if (ui.todoFilter === "done") list = list.filter((t) => t.done);
  list.sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const ad = a.due || "9999", bd = b.due || "9999";
    if (ad !== bd) return ad.localeCompare(bd);
    return PRIO[a.priority].rank - PRIO[b.priority].rank;
  });
  const seg = (v, l) => `<button class="${ui.todoFilter === v ? "active" : ""}" data-todo-filter="${v}">${l}</button>`;
  let html = `<div class="view-head"><h2>할 일</h2><div class="seg">${seg("active", "진행중")}${seg("done", "완료")}${seg("all", "전체")}</div></div>`;
  html += list.length ? `<div class="agenda">${list.map(todoRow).join("")}</div>` : `<div class="empty">${IC.check}표시할 할 일이 없습니다.</div>`;
  return html;
}

/* ---------- 렌더: 설정 ---------- */
function renderSettings() {
  const dark = currentDark();
  return `<div class="view-head"><h2>설정</h2></div>
    <div class="set-group">
      <div class="set-row"><div><div class="lab">다크 모드</div><div class="desc">화면 테마를 전환합니다</div></div>
        <button class="switch ${dark ? "on" : ""}" id="set-theme"></button></div>

/* ---------- 행 렌더 ---------- */
function eventRow(e) {
  const id = e._base || e.id;
  const meta = [e.location, e.repeat !== "none" ? REPEAT_LABEL[e.repeat] : "", e.reminder !== "none" ? "알림" : ""].filter(Boolean).join(" · ");
  const delay = e._delay ? `<span class="dbadge">D+${e._delay}</span>` : "";
  const ptag = `<span class="tag ${e.priority}">${PRIO[e.priority].label}</span>`;
  return `<div class="row-item ${e.cat} pri-${e.priority} ${e.done ? "done" : ""}">
    <div class="box ${e.done ? "done" : ""}" data-ev-toggle="${id}">${e.done ? IC.check : ""}</div>
    <div class="time">${delay}<span>${esc(evTimeText(e) || "")}</span></div>
    <div class="body" data-edit-event="${id}"><div class="title">${catIcon(e.cat)} ${esc(e.title)} ${ptag}</div>${meta ? `<div class="place">${esc(meta)}</div>` : ""}</div>
    <div class="actions">
      <button data-edit-event="${id}" title="수정">${IC.edit}</button>
      <button data-del-event="${id}" title="삭제">${IC.trash}</button>
    </div></div>`;
}
function todoRow(t) {
  const tag = t.priority !== "normal" ? `<span class="tag ${t.priority}">${PRIO[t.priority].label}</span>` : "";
  const overdue = !t.done && t.due && t.due < todayStr();
  const dueTxt = t.due ? `<span class="${overdue ? "tag overdue" : ""}">${fmtDueMeta(t.due)}</span>` : "";
  const late = t.rolledFrom ? daysBetween(t.rolledFrom, todayStr()) : 0;
  const roll = late > 0 ? `<span class="dbadge">D+${late}</span>` : "";
  return `<div class="todo ${t.done ? "done" : ""}">
    <div class="box ${t.done ? "done" : ""}" data-toggle="${t.id}">${t.done ? IC.check : ""}</div>
    <div class="tx" data-edit-todo="${t.id}">
      <div class="title">${esc(t.title)}</div>
      <div class="meta">${tag}${dueTxt}${roll}<span>· ${t.cat === "work" ? "업무" : "개인"}</span></div>
    </div>
    <div class="actions">
      <button data-edit-todo="${t.id}" title="수정">${IC.edit}</button>
      <button data-del-todo="${t.id}" title="삭제">${IC.trash}</button>
    </div></div>`;
}

/* ---------- 대시보드 (캘린더 모드 우측) — 기본 한 줄, 클릭 시 펼침 ---------- */
function renderDash() {
  const today = todayStr();
  const evToday = eventsOn(today).length;
  const dueToday = visibleTodos().filter((t) => !t.done && t.due === today).length;
  const overdue = visibleTodos().filter((t) => !t.done && t.due && t.due < today);
  const important = visibleTodos().filter((t) => !t.done && t.priority !== "normal").sort((a, b) => PRIO[a.priority].rank - PRIO[b.priority].rank).slice(0, 5);

  let html = `<div class="dash-head"><span class="dash-title">요약</span><button class="dash-x" id="dash-collapse" title="패널 접기 (캘린더만 보기)">⟩</button></div>`;

  // 오늘 요약 (한 줄 / 펼침)
  const sumVal = `일정 ${evToday} · 마감 ${dueToday} · <span class="${overdue.length ? "warn" : ""}">지연 ${overdue.length}</span>`;
  html += `<div><div class="sumline" data-dash-toggle="summary"><span class="lbl">오늘 요약</span><span class="val">${sumVal}</span><span class="chev">${ui.dashExp.summary ? "▲" : "▼"}</span></div>`;
  if (ui.dashExp.summary) {
    html += `<div class="kpis" style="margin-top:8px">
      <div class="kpi"><div class="n">${evToday}</div><div class="l">오늘 일정</div></div>
      <div class="kpi"><div class="n">${dueToday}</div><div class="l">오늘 마감</div></div>
      <div class="kpi ${overdue.length ? "warn" : ""}"><div class="n">${overdue.length}</div><div class="l">지연 업무</div></div></div>`;
    if (overdue.length) {
      html += `<div style="margin-top:8px">` + overdue.slice(0, 5).map((t) => `<div class="roll-row"><span class="from">${t.due.slice(5)}</span><span>${esc(t.title)}</span></div>`).join("");
      html += `<button class="btn-roll" id="roll-desktop">${IC.roll}지난 업무 오늘로 이월</button></div>`;
    }
  }
  html += `</div>`;

  // 중요 할 일 (한 줄 / 펼침)
  const impVal = important.length ? `${important.length}건 · ${esc(important[0].title)}${important.length > 1 ? " 외" : ""}` : "없음";
  html += `<div><div class="sumline" data-dash-toggle="important"><span class="lbl">중요 할 일</span><span class="val">${impVal}</span><span class="chev">${ui.dashExp.important ? "▲" : "▼"}</span></div>`;
  if (ui.dashExp.important) {
    html += important.length ? `<div class="agenda" style="margin-top:8px">${important.map(todoRow).join("")}</div>` : `<div class="empty">중요 표시된 할 일 없음</div>`;
  }
  html += `</div>`;
  return html;
}

/* ---------- 칩 ---------- */
function chipHtml() {
  const c = (v, l, dot) => `<button class="chip ${ui.cat === v ? "active" : ""}" data-cat="${v}"><span class="dot ${dot}"></span>${l}</button>`;
  return c("all", "전체", "") + c("work", "업무", "cat-dot work") + c("personal", "개인", "cat-dot personal");
}

/* ---------- 메인 렌더 ---------- */
function render() {
  document.getElementById("today-date").textContent = fmtKDate(todayStr());
  document.getElementById("c-today").textContent = eventsOn(todayStr()).length || "";
  document.getElementById("c-todo").textContent = Store.state.todos.filter((t) => !t.done).length || "";
  document.querySelectorAll(".tab[data-view], .bottom-nav button[data-view]").forEach((b) => b.classList.toggle("active", b.dataset.view === ui.view));
  document.querySelectorAll("[data-chips]").forEach((el) => (el.innerHTML = chipHtml()));

  const content = document.getElementById("content");
  if (ui.view === "today") content.innerHTML = renderToday();
  else if (ui.view === "calendar") content.innerHTML = renderCalendar();
  else if (ui.view === "todo") content.innerHTML = renderTodo();
  else if (ui.view === "settings") content.innerHTML = renderSettings();
  // 캘린더 컨트롤을 상단 탭바로 (한 행에 통합 → 캘린더 영역 확대)
  document.getElementById("tabbar-cal").innerHTML = ui.view === "calendar" ? calControlsHtml() : "";

  // 우측 요약 패널: 캘린더 모드에서만 (리사이즈/접기 가능)
  const app = document.getElementById("app");
  const dash = document.getElementById("dash");
  const showDash = ui.view === "calendar";
  app.classList.toggle("has-dash", showDash);
  app.classList.toggle("dash-collapsed", ui.dashCollapsed);
  document.getElementById("dash-reopen").style.display = (showDash && ui.dashCollapsed) ? "block" : "none";
  document.documentElement.style.setProperty("--dash-w", ui.splitW + "px");
  dash.innerHTML = showDash ? renderDash() : "";

  if (ui.view === "calendar") wireCalendarDnD();
  renderPin();
  scheduleReminders();
}

/* ---------- 모달 (추가/수정) ---------- */
let modalState = null;
function openModal(kind, data) {
  modalState = { kind, id: data && data.id ? data.id : null };
  renderModal(kind, data || {}, (data && data.cat) || (ui.cat === "personal" ? "personal" : "work"), !!(data && data.id));
  document.getElementById("modal-backdrop").classList.add("open");
}
function closeModal() { document.getElementById("modal-backdrop").classList.remove("open"); modalState = null; closeTimePicker(); }

/* ---------- 시계형 시간 선택기 (시 → 분) ---------- */
let tpState = null;
function ensureTimePop() {
  let el = document.getElementById("timepop");
  if (el) return el;
  el = document.createElement("div"); el.id = "timepop"; el.className = "timepop"; el.hidden = true;
  el.innerHTML = `<div class="tp-head"><span class="tp-cur" id="tp-cur"></span><div class="tp-steps"><button type="button" data-step="h">시</button><button type="button" data-step="m">분</button></div></div><div class="tp-clock" id="tp-grid"></div><div class="tp-hint" id="tp-hint"></div>`;
  document.body.appendChild(el);
  el.addEventListener("click", (e) => {
    e.stopPropagation();
    const s = e.target.closest(".tp-steps button"); if (s) { tpRender(s.dataset.step); return; }
    const g = e.target.closest("#tp-grid button"); if (g) tpPick(g.dataset.v);
  });
  return el;
}
function openTimePicker(inp, onPick) {
  const el = ensureTimePop();
  const [h, m] = (inp.value || "09:00").split(":").map(Number);
  tpState = { inp, onPick, h: isNaN(h) ? 9 : h, m: isNaN(m) ? 0 : m, step: "h" };
  el.hidden = false;
  const r = inp.getBoundingClientRect();
  let left = r.left, top = r.bottom + 6;
  if (left + 220 > window.innerWidth) left = window.innerWidth - 224;
  if (top + 250 > window.innerHeight) top = Math.max(8, r.top - 256);
  el.style.left = Math.max(8, left) + "px"; el.style.top = top + "px";
  tpRender("h");
}
function tpRender(step) {
  if (!tpState) return; tpState.step = step;
  const el = document.getElementById("timepop");
  document.getElementById("tp-cur").textContent = pad(tpState.h) + ":" + pad(tpState.m);
  document.getElementById("tp-hint").textContent = step === "h" ? "시(hour)를 선택하세요" : "분(minute)을 선택하세요";
  el.querySelectorAll(".tp-steps button").forEach((b) => b.classList.toggle("active", b.dataset.step === step));
  const clock = document.getElementById("tp-grid");
  const C = 102; // 시계 중심
  const btn = (val, label, x, y, cls, sel) => `<button type="button" data-v="${val}" class="${cls || ""} ${sel ? "sel" : ""}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;">${label}</button>`;
  let html = "";
  if (step === "h") {
    // 바깥 고리: 1~12, 안쪽 고리: 0,13~23 (12·00을 맨 위로)
    for (let i = 1; i <= 12; i++) { const a = (i / 12) * 2 * Math.PI; html += btn(i, pad(i), C + 82 * Math.sin(a), C - 82 * Math.cos(a), "", i === tpState.h); }
    for (let i = 0; i < 12; i++) { const val = i === 0 ? 0 : i + 12; const a = (i / 12) * 2 * Math.PI; html += btn(val, pad(val), C + 52 * Math.sin(a), C - 52 * Math.cos(a), "inner", val === tpState.h); }
  } else {
    for (let m = 0; m < 60; m += 5) { const a = (m / 60) * 2 * Math.PI; html += btn(m, pad(m), C + 82 * Math.sin(a), C - 82 * Math.cos(a), "", m === tpState.m); }
  }
  clock.innerHTML = html + `<div class="tp-center"></div>`;
}
function tpPick(v) {
  v = parseInt(v, 10);
  if (tpState.step === "h") { tpState.h = v; tpRender("m"); }   // 시 선택 → 분 선택으로
  else { tpState.m = v; tpState.onPick(pad(tpState.h) + ":" + pad(tpState.m)); closeTimePicker(); }
}
function closeTimePicker() { const el = document.getElementById("timepop"); if (el) el.hidden = true; tpState = null; }
document.addEventListener("click", (e) => { if (tpState && !e.target.closest("#timepop") && !e.target.closest("[data-tp]")) closeTimePicker(); });

function renderModal(kind, data, cat, isEdit) {
  const catSeg = `<div class="seg-cat" id="m-cat">
      <button type="button" data-v="work" class="${cat === "work" ? "active" : ""}"><span class="dot cat-dot work"></span>업무</button>
      <button type="button" data-v="personal" class="${cat === "personal" ? "active" : ""}"><span class="dot cat-dot personal"></span>개인</button>
    </div>`;
  const tabs = `<div class="type-tabs">
      <button type="button" data-k="event" class="${kind === "event" ? "active" : ""}">일정</button>
      <button type="button" data-k="todo" class="${kind === "todo" ? "active" : ""}">할 일</button>
    </div>`;
  const clockIc = `<svg class="tp-ic" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"/></svg>`;
  const timeInput = (id, val) => `<div class="tp-wrap"><input id="${id}" class="tp-input" readonly value="${esc(val)}" placeholder="--:--" data-tp/>${clockIc}</div>`;
  let fields;
  if (kind === "event") {
    const allDay = !!data.allDay;
    const opt = (obj, cur) => Object.entries(obj).map(([v, l]) => `<option value="${v}" ${cur === v ? "selected" : ""}>${l}</option>`).join("");
    const startV = data.time || "09:00";
    const endV = data.endTime || (isEdit ? "" : addMin(startV, 30));
    const remindV = data.reminder != null ? data.reminder : "0";   // 기본: 정각
    const prioV = data.priority || "normal";
    fields = `
      <div class="field"><label>제목</label><input id="f-title" value="${esc(data.title || "")}" placeholder="예: 팀 회의" /></div>
      <div class="field"><label class="inline-check"><input type="checkbox" id="f-allday" ${allDay ? "checked" : ""}/> 종일</label></div>
      <div class="field"><label>날짜</label><input id="f-date" type="date" value="${esc(data.date || todayStr())}" /></div>
      <div class="field-row" id="time-row" style="${allDay ? "display:none" : ""}">
        <div class="field"><label>시작</label>${timeInput("f-time", startV)}</div>
        <div class="field"><label>종료</label>${timeInput("f-endtime", endV)}</div>
      </div>
      <div class="field-row">
        <div class="field"><label>분류</label>${catSeg}</div>
        <div class="field"><label>우선순위</label><select id="f-prio">
          <option value="urgent" ${prioV === "urgent" ? "selected" : ""}>긴급</option>
          <option value="high" ${prioV === "high" ? "selected" : ""}>높음</option>
          <option value="normal" ${prioV === "normal" ? "selected" : ""}>보통</option></select></div>
      </div>
      <div class="field"><label>알림</label><select id="f-remind">${opt(REMIND_LABEL, remindV)}</select></div>
      <button type="button" class="more-btn" id="m-more">+ 추가 옵션 (위치·반복·설명)</button>
      <div id="m-extra" hidden>
        <div class="field"><label>위치</label><input id="f-loc" value="${esc(data.location || "")}" placeholder="예: 2층 회의실 / 온라인" /></div>
        <div class="field"><label>반복</label><select id="f-repeat">${opt(REPEAT_LABEL, data.repeat || "none")}</select></div>
        <div class="field"><label>설명</label><textarea id="f-note" placeholder="메모/설명">${esc(data.note || "")}</textarea></div>
      </div>`;
  } else {
    const p = data.priority || "normal";
    fields = `
      <div class="field"><label>할 일</label><input id="f-title" value="${esc(data.title || "")}" placeholder="예: 견적서 확인" /></div>
      <div class="field-row">
        <div class="field"><label>마감일</label><input id="f-due" type="date" value="${esc(data.due || "")}" /></div>
        <div class="field"><label>우선순위</label><select id="f-prio">
            <option value="urgent" ${p === "urgent" ? "selected" : ""}>긴급</option>
            <option value="high" ${p === "high" ? "selected" : ""}>높음</option>
            <option value="normal" ${p === "normal" ? "selected" : ""}>보통</option></select></div>
      </div>
      <div class="field"><label>분류</label>${catSeg}</div>
      <div class="field"><label>메모</label><textarea id="f-note" placeholder="메모">${esc(data.note || "")}</textarea></div>`;
  }
  document.getElementById("modal").innerHTML = `
    <h3>${isEdit ? "수정" : "새로 추가"}</h3>
    ${isEdit ? "" : tabs}
    <form id="m-form">${fields}
      <div class="modal-actions">
        ${isEdit ? `<button type="button" class="btn-del" id="m-del">삭제</button>` : ""}
        <button type="button" class="btn-sub" id="m-cancel">취소</button>
        <button type="submit" class="btn-primary" style="justify-content:center">${isEdit ? "저장" : "추가"}</button>
      </div></form>`;

  document.getElementById("modal").classList.add("compact");

  document.querySelectorAll("#m-cat button").forEach((b) => b.addEventListener("click", () => {
    curCat = b.dataset.v; document.querySelectorAll("#m-cat button").forEach((x) => x.classList.toggle("active", x === b));
  }));
  if (!isEdit) document.querySelectorAll(".type-tabs button").forEach((b) => b.addEventListener("click", () => openModal(b.dataset.k, { date: data.date, time: data.time, cat: curCat })));
  const allDayEl = document.getElementById("f-allday");
  if (allDayEl) allDayEl.addEventListener("change", () => { document.getElementById("time-row").style.display = allDayEl.checked ? "none" : ""; });
  // [추가 옵션] 접기/펼치기 (편집 시 값이 있으면 자동 펼침)
  const moreBtn = document.getElementById("m-more");
  if (moreBtn) {
    const extra = document.getElementById("m-extra");

  if (del) del.addEventListener("click", () => {
    if (!confirm(kind === "event" && document.getElementById("f-repeat") && document.getElementById("f-repeat").value !== "none"

  });
  document.getElementById("m-form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const title = document.getElementById("f-title").value.trim();
    if (!title) { document.getElementById("f-title").focus(); return; }
    if (kind === "event") {
      const allDay = document.getElementById("f-allday").checked;
      const reminder = document.getElementById("f-remind").value;
      const payload = { title, cat: curCat, allDay,
        date: document.getElementById("f-date").value || todayStr(),
        time: allDay ? "" : (document.getElementById("f-time").value || ""),
        endTime: allDay ? "" : (document.getElementById("f-endtime").value || ""),
        location: document.getElementById("f-loc").value.trim(),
        note: document.getElementById("f-note").value.trim(),
        repeat: document.getElementById("f-repeat").value,
        priority: document.getElementById("f-prio").value, reminder };
      if (reminder !== "none") requestNotify();
      if (modalState.id) Store.updateEvent(modalState.id, payload); else Store.addEvent(payload);
      toast(modalState.id ? "일정을 수정했습니다" : "일정을 추가했습니다");
    } else {
      const payload = { title, cat: curCat, due: document.getElementById("f-due").value || null,
        priority: document.getElementById("f-prio").value, note: document.getElementById("f-note").value.trim() };
      if (modalState.id) Store.updateTodo(modalState.id, payload); else Store.addTodo(payload);
      toast(modalState.id ? "할 일을 수정했습니다" : "할 일을 추가했습니다");
    }
    closeModal();
  });
  setTimeout(() => { const el = document.getElementById("f-title"); if (el) el.focus(); }, 30);
}

/* ---------- 알림 (지속형 팝업 + 브라우저 Notification 백업) ---------- */
let reminderTimers = [];
const firedAlerts = new Set();   // 이미 뜬 알림(중복 방지)
const snoozeTimers = {};
function requestNotify() { try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch (e) {} }

// 컴퓨터(로컬) 시간 기준으로 알림 예약. 앱/PiP가 열려 있는 동안 동작.
function scheduleReminders() {
  reminderTimers.forEach(clearTimeout); reminderTimers = [];
  const now = Date.now();
  [0, 1].forEach((off) => {
    const ds = ymd(addDays(new Date(), off));
    eventsOn(ds).forEach((e) => {
      if (e.allDay || !e.time || !e.reminder || e.reminder === "none") return;
      const dt = new Date(`${ds}T${e.time.length === 5 ? e.time : "09:00"}:00`);
      const fire = dt.getTime() - parseInt(e.reminder, 10) * 60000;
      const key = e._base + "@" + ds;
      if (fire > now && fire - now < 26 * 3600 * 1000 && !firedAlerts.has(key)) {
        reminderTimers.push(setTimeout(() => fireAlert(e, key), fire - now));
      }
    });
  });
}
function fireAlert(e, key) {
  firedAlerts.add(key);
  // 탭이 숨겨져 있으면 OS 알림도 백업으로 (확인 전까지 유지)
  try {
    if ("Notification" in window && Notification.permission === "granted" && document.hidden) {
      new Notification("일정 알림: " + e.title, { body: `${evTimeText(e)} ${e.location || ""}`.trim(), requireInteraction: true });
    }
  } catch (_) {}
  showAlertCard(e, key);
}
// 우측 지속형 팝업 — 확인/30분/1시간 액션 전까지 사라지지 않음
function showAlertCard(e, key) {
  const stacks = [document.getElementById("alert-stack")];
  if (pipWin && pipWin.document) { const s = pipWin.document.getElementById("alert-stack"); if (s) stacks.push(s); }
  const host = stacks[0];
  const card = document.createElement("div");
  card.className = "alert-card";
  card.innerHTML = `<div class="ac-head"><span class="ac-badge">${IC.bell}알림</span><span class="ac-time">${esc(evTimeText(e))}</span></div>
    <div class="ac-title">${esc(e.title)}</div>${e.location ? `<div class="ac-loc">${esc(e.location)}</div>` : ""}
    <div class="ac-actions"><button data-a="ok" class="ac-ok">확인</button><button data-a="30">30분 뒤</button><button data-a="60">1시간 뒤</button></div>`;
  card.addEventListener("click", (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    card.remove();
    if (b.dataset.a === "30" || b.dataset.a === "60") {
      const mins = parseInt(b.dataset.a, 10);
      clearTimeout(snoozeTimers[key]);
      snoozeTimers[key] = setTimeout(() => showAlertCard(e, key), mins * 60000);
      toast(`${mins}분 뒤 다시 알림`);
    }
  });
  host.appendChild(card);
}

function exportData() {

  a.href = url; a.download = `scheduler-backup-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000); toast("백업 파일을 내보냈습니다");

function importData() {
  const input = document.createElement("input"); input.type = "file"; input.accept = "application/json,.json";
  input.addEventListener("change", () => {

    const reader = new FileReader();

/* ---------- 핀: 오늘 할 일 고정 ----------
   지원 브라우저(크롬 등)에서는 Document Picture-in-Picture로 '항상 위'에 뜨는
   실제 창을 띄웁니다. 미지원 시 앱 내부 플로팅 위젯으로 대체합니다. */
const pinState = { open: false, collapsed: false, opacity: 100, x: null, y: null, doneOpen: false };
let pipWin = null;
function pipSupported() { return "documentPictureInPicture" in window; }
function loadPin() { try { const p = JSON.parse(localStorage.getItem("scheduler:pin") || "{}"); Object.assign(pinState, p); pinState.open = false; pinState.doneOpen = false; } catch (e) {} }
function savePin() { try { localStorage.setItem("scheduler:pin", JSON.stringify(pinState)); } catch (e) {} }

// 핀/항상위: 미완료 할 일(어제까지 못한 것 + 오늘 + 그 사이 추가) → 구분선 → 오늘 일정(이월 포함)
function pinItemsHtml() {
  const today = todayStr();
  const todos = Store.state.todos.filter((t) => !t.done && (!t.due || t.due <= today))
    .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || PRIO[a.priority].rank - PRIO[b.priority].rank);
  const events = todayAgendaEvents();
  let h = `<div class="pin-sec">할 일 · ${todos.length}</div>`;
  h += todos.length ? todos.map((t) => {
    const late = t.rolledFrom ? `<span class="dd">D+${daysBetween(t.rolledFrom, today)}</span>` : (t.due && t.due < today ? `<span class="dd">D+${daysBetween(t.due, today)}</span>` : "");
    return `<div class="pin-todo pri-${t.priority}">
      <div class="box" data-pin-toggle="${t.id}"></div>
      <div class="pin-tx" data-pin-edit-todo="${t.id}"><div class="t">${late}${esc(t.title)}</div><div class="m">${t.due ? fmtDueMeta(t.due) : "기한 없음"} · ${PRIO[t.priority].label}</div></div>
    </div>`;
  }).join("") : `<div class="pin-empty">${IC.check} 할 일 없음</div>`;
  h += `<div class="pin-divider">오늘 일정</div>`;
  h += events.length ? events.map((e) => {
    const dd = e._delay ? `<span class="dd">D+${e._delay}</span>` : "";
    return `<div class="pin-todo pri-${e.priority}">
      <div class="box" data-pin-ev-toggle="${e._base || e.id}"></div>
      <div class="pin-tx" data-pin-edit-event="${e._base || e.id}"><div class="t">${dd}${catIcon(e.cat)} ${esc(e.title)}</div><div class="m">${esc(evTimeText(e))}${e.location ? " · " + esc(e.location) : ""}</div></div>
    </div>`;
  }).join("") : `<div class="pin-empty">오늘 일정 없음</div>`;

  // 완료 섹션 — 되돌리기(체크 해제) 가능, 1주일 지난 항목은 자동 삭제됨
  const doneItems = [
    ...Store.state.todos.filter((t) => t.done).map((t) => ({ kind: "todo", id: t.id, title: t.title, pri: t.priority, cat: t.cat, at: t.doneAt || 0 })),
    ...Store.state.events.filter((e) => e.done).map((e) => ({ kind: "event", id: e.id, title: e.title, pri: e.priority, cat: e.cat, at: e.doneAt || 0 })),
  ].sort((a, b) => b.at - a.at);
  h += `<div class="pin-divider pin-fold" data-pin-donetoggle style="cursor:pointer">완료 · ${doneItems.length} ${pinState.doneOpen ? "▲" : "▼"}</div>`;
  if (pinState.doneOpen) {
    h += doneItems.length ? doneItems.map((d) => `
      <div class="pin-todo done pri-${d.pri}">
        <div class="box done" data-pin-${d.kind === "todo" ? "toggle" : "ev-toggle"}="${d.id}">${IC.check}</div>
        <div><div class="t">${d.kind === "event" ? catIcon(d.cat) + " " : ""}${esc(d.title)}</div><div class="m">완료 · 체크 해제 시 복원</div></div>
      </div>`).join("") : `<div class="pin-empty">완료된 항목 없음</div>`;
  }
  return h;
}
function pinBodyClick(e) {
  if (e.target.closest("[data-pin-donetoggle]")) { pinState.doneOpen = !pinState.doneOpen; savePin(); renderPin(); return; }
  const tb = e.target.closest("[data-pin-toggle]"); if (tb) { Store.toggleTodo(tb.dataset.pinToggle); return; }
  const eb = e.target.closest("[data-pin-ev-toggle]"); if (eb) { Store.toggleEvent(eb.dataset.pinEvToggle); return; }
  // 글자 클릭 → 수정창 (본 앱 창에서 열림; PiP인 경우 본 창을 앞으로)
  const et = e.target.closest("[data-pin-edit-todo]");
  if (et) { const td = Store.state.todos.find((x) => x.id === et.dataset.pinEditTodo); if (td) { try { window.focus(); } catch (_) {} openModal("todo", td); } return; }
  const ee = e.target.closest("[data-pin-edit-event]");
  if (ee) { const ev = Store.state.events.find((x) => x.id === ee.dataset.pinEditEvent); if (ev) { try { window.focus(); } catch (_) {} openModal("event", ev); } return; }

// 핀 팝업 빠른 추가 (오늘 기준)
function quickAddPin(kind, title) {

// 빠른 추가 입력창 와이어링 (앱 위젯/PiP 공용) — root: 요소가 있는 document
function wireQuickAdd(root, kindId, inputId, goId) {
  const kindEl = root.getElementById(kindId), inputEl = root.getElementById(inputId), goEl = root.getElementById(goId);
  if (!inputEl) return;
  const submit = () => { if (quickAddPin(kindEl ? kindEl.value : "todo", inputEl.value)) { inputEl.value = ""; inputEl.focus(); } };
  goEl && goEl.addEventListener("click", submit);
  inputEl.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); submit(); } });
}

  } catch (e) { pipWin = null; renderPin(); }
