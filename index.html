function closePip() { if (pipWin) { try { pipWin.close(); } catch (_) {} pipWin = null; } }

function togglePin() {
  if (pinState.open) { pinState.open = false; savePin(); closePip(); renderPin(); return; }
  pinState.open = true; savePin();
  renderPin(); // 버튼 상태 + 폴백 위젯 즉시 반영
  if (pipSupported()) openPip(); // 지원 시 항상-위 PiP 창으로 승격 (성공하면 위젯 숨김)
}

function renderPin() {
  document.getElementById("pin-btn").classList.toggle("on", pinState.open);
  const w = document.getElementById("pin-widget");
  // PiP 창이 열려 있으면 그쪽을 갱신하고 앱 내부 위젯은 숨김
  if (pipWin && pipWin.document) {
    const pb = pipWin.document.getElementById("pip-body");
    if (pb) { pb.innerHTML = pinItemsHtml(); pb.style.opacity = (pinState.opacity / 100).toFixed(2); }
    w.hidden = true; return;
  }
  if (!pinState.open) { w.hidden = true; return; }
  // 앱 내부 위젯 (PiP 미지원 폴백)
  w.hidden = false;
  w.classList.toggle("collapsed", pinState.collapsed);
  w.style.opacity = (pinState.opacity / 100).toFixed(2);
  if (pinState.x == null) { w.style.right = "16px"; w.style.left = "auto"; w.style.top = "68px"; }
  else { w.style.left = pinState.x + "px"; w.style.top = pinState.y + "px"; w.style.right = "auto"; }
  document.getElementById("pin-opacity").value = pinState.opacity;
  document.getElementById("pin-opacity-val").textContent = pinState.opacity + "%";

}
function wirePin() {
  document.getElementById("pin-btn").addEventListener("click", togglePin);
  document.getElementById("pin-hide").addEventListener("click", () => { pinState.open = false; savePin(); closePip(); renderPin(); });
  document.getElementById("pin-collapse").addEventListener("click", () => { pinState.collapsed = !pinState.collapsed; savePin(); renderPin(); });
  document.getElementById("pin-optoggle").addEventListener("click", () => {
    const w = document.getElementById("pin-widget"); w.classList.toggle("show-op");
    document.getElementById("pin-optoggle").classList.toggle("on", w.classList.contains("show-op"));
  });
  document.getElementById("pin-add").addEventListener("click", () => {
    const w = document.getElementById("pin-widget"); w.classList.toggle("show-qa");
    document.getElementById("pin-add").classList.toggle("on", w.classList.contains("show-qa"));
    if (w.classList.contains("show-qa")) setTimeout(() => document.getElementById("pin-qa-input").focus(), 20);
  });
  wireQuickAdd(document, "pin-qa-kind", "pin-qa-input", "pin-qa-go");
  const op = document.getElementById("pin-opacity");
  op.addEventListener("input", () => { pinState.opacity = parseInt(op.value, 10); document.getElementById("pin-opacity-val").textContent = pinState.opacity + "%"; document.getElementById("pin-widget").style.opacity = (pinState.opacity / 100).toFixed(2); });
  op.addEventListener("change", savePin);
  document.getElementById("pin-body").addEventListener("click", pinBodyClick);
  const head = document.getElementById("pin-head"); const w = document.getElementById("pin-widget");
  let drag = null;
  head.addEventListener("pointerdown", (e) => { if (e.target.closest("button")) return; const r = w.getBoundingClientRect(); drag = { dx: e.clientX - r.left, dy: e.clientY - r.top }; head.setPointerCapture(e.pointerId); });
  head.addEventListener("pointermove", (e) => {
    if (!drag) return;
    let x = e.clientX - drag.dx, y = e.clientY - drag.dy;
    x = Math.max(4, Math.min(window.innerWidth - w.offsetWidth - 4, x));
    y = Math.max(4, Math.min(window.innerHeight - 40, y));
    pinState.x = x; pinState.y = y; w.style.left = x + "px"; w.style.top = y + "px"; w.style.right = "auto";
  });
  head.addEventListener("pointerup", () => { if (drag) { drag = null; savePin(); } });
}

/* ---------- 캘린더 드래그 앤 드롭 ---------- */
let dragData = null;
function wireCalendarDnD() {
  const grid = document.querySelector(".week-grid"); if (!grid) return;
  grid.querySelectorAll("[data-drag]").forEach((el) => {
    el.addEventListener("dragstart", (e) => { dragData = { type: el.dataset.drag, id: el.dataset.id }; el.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", el.dataset.id); e.dataTransfer.effectAllowed = "move"; } catch (_) {} });
    el.addEventListener("dragend", () => { el.classList.remove("dragging"); dragData = null; grid.querySelectorAll(".drop-hover").forEach((c) => c.classList.remove("drop-hover")); });
  });
  grid.querySelectorAll(".cell, .band-cell").forEach((cell) => {
    cell.addEventListener("dragover", (e) => { if (!dragData) return; e.preventDefault(); cell.classList.add("drop-hover"); });
    cell.addEventListener("dragleave", () => cell.classList.remove("drop-hover"));
    cell.addEventListener("drop", (e) => {
      e.preventDefault(); cell.classList.remove("drop-hover"); if (!dragData) return;
      const date = cell.dataset.date; const isBand = cell.dataset.band === "1";
      if (dragData.type === "todo") { Store.updateTodo(dragData.id, { due: date }); toast("할 일을 옮겼습니다"); }
      else if (dragData.type === "event") {
        const ev = Store.state.events.find((x) => x.id === dragData.id); if (!ev) return;
        if (isBand) Store.updateEvent(dragData.id, { date, allDay: true, time: "", endTime: "" });
        else {
          const newHour = cell.dataset.hour; let endTime = ev.endTime;
          if (ev.time && ev.endTime) { // 지속시간 유지
            const dur = (parseInt(ev.endTime.slice(0,2))*60+parseInt(ev.endTime.slice(3))) - (parseInt(ev.time.slice(0,2))*60+parseInt(ev.time.slice(3)));
            const startM = parseInt(newHour.slice(0,2))*60; const endM = Math.min(startM + Math.max(dur,0), 23*60+59);
            endTime = pad(Math.floor(endM/60))+":"+pad(endM%60);
          }
          Store.updateEvent(dragData.id, { date, allDay: false, time: newHour, endTime });
        }
        toast("일정을 옮겼습니다");
      }
    });
  });
}

/* ---------- 전역 이벤트 ---------- */
function setView(v) { ui.view = v; saveUI(); render(); window.scrollTo(0, 0); }
function wireGlobal() {
  document.querySelectorAll(".tab[data-view], .bottom-nav button[data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  document.getElementById("add-btn").addEventListener("click", () => openModal(ui.view === "todo" ? "todo" : "event", { cat: ui.cat === "personal" ? "personal" : "work" }));
  document.getElementById("search").addEventListener("input", (e) => { ui.search = e.target.value; render(); });
  document.querySelector(".app").addEventListener("input", (e) => {
    if (e.target.id === "set-fs") { applyFontSize(parseInt(e.target.value, 10)); const l = document.getElementById("set-fs-val"); if (l) l.textContent = fontSize + "px"; }
  });
  document.getElementById("theme-btn").addEventListener("click", () => setTheme(!currentDark()));
  document.getElementById("modal-backdrop").addEventListener("click", (e) => { if (e.target.id === "modal-backdrop") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  document.addEventListener("click", (e) => {
    if (e.target.closest("#timepop") || e.target.closest(".pin-widget")) return; // 별도 핸들러 처리
    const t = e.target.closest("[data-cat],[data-todo-filter],[data-toggle],[data-ev-toggle],[data-edit-event],[data-del-event],[data-edit-todo],[data-del-todo],[data-ww],[data-dash-toggle],#dash-collapse,#wk-prev,#wk-next,#wk-today,#roll-desktop,#roll-mobile,#set-theme,#set-pin,#set-export,#set-import,#set-clear,#set-alert-demo");
    if (!t) return;
    if (t.dataset.evToggle) { Store.toggleEvent(t.dataset.evToggle); return; }
    if (t.dataset.dashToggle) { ui.dashExp[t.dataset.dashToggle] = !ui.dashExp[t.dataset.dashToggle]; saveUI(); render(); return; }
    if (t.id === "dash-collapse") { ui.dashCollapsed = true; saveUI(); render(); return; }
    if (t.id === "set-alert-demo") { showAlertCard({ title: "○○업체 방문 (예시 알림)", time: "14:00", endTime: "16:00", location: "세종 공장", allDay: false }, "demo-" + Date.now()); toast("알림 팝업 예시를 띄웠습니다"); return; }
    if (t.dataset.cat != null) { ui.cat = t.dataset.cat; render(); return; }
    if (t.dataset.todoFilter != null) { ui.todoFilter = t.dataset.todoFilter; render(); return; }
    if (t.dataset.ww != null) { ui.workweek = t.dataset.ww === "1"; saveUI(); render(); return; }
    if (t.dataset.toggle) { Store.toggleTodo(t.dataset.toggle); return; }
    if (t.dataset.editEvent) { const ev = Store.state.events.find((x) => x.id === t.dataset.editEvent); if (ev) openModal("event", ev); return; }
    if (t.dataset.delEvent) { Store.deleteEvent(t.dataset.delEvent); toast("일정을 삭제했습니다"); return; }
    if (t.dataset.editTodo) { const td = Store.state.todos.find((x) => x.id === t.dataset.editTodo); if (td) openModal("todo", td); return; }
    if (t.dataset.delTodo) { Store.deleteTodo(t.dataset.delTodo); toast("할 일을 삭제했습니다"); return; }
    if (t.id === "wk-prev") { ui.weekRef = addDays(ui.weekRef, ui.workweek ? -7 : -7); render(); return; }
    if (t.id === "wk-next") { ui.weekRef = addDays(ui.weekRef, 7); render(); return; }
    if (t.id === "wk-today") { ui.weekRef = startOfWeek(new Date()); render(); return; }
    if (t.id === "roll-desktop" || t.id === "roll-mobile") { const n = Store.rollover(); toast(n ? `${n}건을 오늘로 이월했습니다` : "이월할 업무가 없습니다"); return; }
    if (t.id === "set-theme") { setTheme(!currentDark()); render(); return; }
    if (t.id === "set-pin") { togglePin(); render(); return; }
    if (t.id === "set-export") { exportData(); return; }
    if (t.id === "set-import") { importData(); return; }
    if (t.id === "set-clear") { if (confirm("이 기기의 모든 일정·할 일을 삭제할까요? 되돌릴 수 없습니다.")) { Store.replaceAll({ events: [], todos: [] }); toast("모든 데이터를 삭제했습니다"); } return; }
  });

  // 요약 패널 다시 열기
  document.getElementById("dash-reopen").addEventListener("click", () => { ui.dashCollapsed = false; saveUI(); render(); });

  // 캘린더/요약 2분할 리사이즈 (우측 바 드래그)
  const gutter = document.getElementById("gutter"); const app = document.getElementById("app");
  let rz = null;
  gutter.addEventListener("pointerdown", (e) => { rz = true; gutter.classList.add("dragging"); gutter.setPointerCapture(e.pointerId); e.preventDefault(); });
  gutter.addEventListener("pointermove", (e) => {
    if (!rz) return;
    const right = app.getBoundingClientRect().right;
    let w = right - e.clientX;
    w = Math.max(180, Math.min(560, w));
    ui.splitW = Math.round(w);
    document.documentElement.style.setProperty("--dash-w", ui.splitW + "px");
  });
  gutter.addEventListener("pointerup", () => { if (rz) { rz = false; gutter.classList.remove("dragging"); saveUI(); } });

  // 캘린더 빈 셀 클릭 → 추가
  document.getElementById("content").addEventListener("click", (e) => {
    const cell = e.target.closest(".cell, .band-cell");
    if (cell && !e.target.closest(".evt, .cal-chip")) {
      const band = cell.dataset.band === "1";
      openModal("event", { date: cell.dataset.date, time: band ? "" : cell.dataset.hour, allDay: band, cat: ui.cat === "personal" ? "personal" : "work" });
    }
  });
}

/* ---------- 초기화 ---------- */
(function init() {
  try { const th = localStorage.getItem("scheduler:theme"); if (th) document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  updateThemeIcon();
  loadUI(); loadPin(); loadFS(); applyFontSize(fontSize);
  Store.subscribe(render); Store.load();
  Store.purgeOld();                                   // 완료 후 1주일 지난 항목 자동 삭제
  Store.autoCarry();                                  // 어제까지 미완료 항목을 오늘로 이월(D+N)
  setInterval(() => Store.purgeOld(), 60 * 60 * 1000); // 1시간마다 정리
  wireGlobal(); wirePin();
  render();

  // 날짜(자정) 변경 감지 → 캘린더를 오늘 주간으로 이동 + 이월/정리/재렌더
  let _curDay = todayStr();
  function dayTick() {
    const d = todayStr();
    if (d !== _curDay) {
      _curDay = d;
      ui.weekRef = startOfWeek(new Date());
      Store.autoCarry();
      Store.purgeOld();
      render();
    }
  }
  setInterval(dayTick, 30 * 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) dayTick(); });
  window.addEventListener("focus", dayTick);
  // PWA: 서비스 워커 등록 + 새 버전 자동 갱신
  if ("serviceWorker" in navigator) {
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!hadController || reloading) return; // 최초 설치 때는 새로고침 안 함
      reloading = true; location.reload();     // 새 버전 활성화되면 한 번 자동 새로고침
    });
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((reg) => {
        reg.update();                                   // 방문 시 새 버전 확인
        setInterval(() => reg.update(), 60 * 60 * 1000); // 1시간마다 확인
      }).catch(() => {});
    });
  }
})();
</script>
